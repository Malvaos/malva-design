<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator</title><style>
:root{--bg:#161617;--sf:#1e1e1f;--tr:#3a3a3c;--ink:#f5f5f7;--mu:#8e8e93;--ac:#dc73c2;--on:#1d1d1f;--ln:rgba(245,245,247,.12);--dn:#ff7a85;--ok:#7fd35a;--wall:url(../../brand/wallpapers/malva-graphite-2560x1440.jpg)}
[data-theme=light]{--bg:#f5f5f7;--sf:#ffffff;--tr:#d1d1d6;--ink:#1d1d1f;--mu:#86868b;--ac:#8c3274;--on:#fff;--ln:rgba(29,29,31,.14);--dn:#d6414f;--ok:#3f8a1e;--wall:url(../../brand/wallpapers/malva-silver-2560x1440.jpg)}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{display:grid;place-items:center;background:var(--bg) var(--wall) center/cover fixed;color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.win{background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(30px);border:1px solid var(--ln);border-radius:14px;box-shadow:0 40px 90px -20px rgba(6,6,6,.6);overflow:hidden;display:flex;flex-direction:column}
.tb{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--ln);flex:none}
.dots{display:flex;gap:8px;margin-right:8px}.dots i{width:12px;height:12px;border-radius:50%;background:#d84a5a}.dots i:nth-child(2){background:#e0a838}.dots i:nth-child(3){background:#4a8a30}
.ttl{font-weight:600;font-size:13px;flex:1;text-align:center;color:var(--mu)}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--mu);transition:.15s}.ib:hover{background:var(--tr);color:var(--ink)}.ib.on{background:var(--ac);color:var(--on)}
#th{position:fixed;right:16px;bottom:16px;width:36px;height:36px;border:1px solid var(--ln);background:var(--sf);z-index:9}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style><style>
.m{display:flex;gap:4px;margin:12px 16px 0;padding:3px;background:var(--tr);border-radius:10px}.m button{flex:1;padding:6px;border-radius:8px;color:var(--mu);font-weight:600}.m .on{background:var(--ac);color:var(--on)}
.disp{padding:18px 22px 10px;text-align:right;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end}#ex{color:var(--mu);min-height:20px;font-size:15px}#rs{font-size:46px;font-weight:300;overflow:hidden;white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px 16px;flex:1}.pad.s{grid-template-columns:repeat(5,1fr)}
.pad button{border-radius:12px;background:var(--tr);font-size:18px;font-weight:500;transition:.12s}.pad button:hover{filter:brightness(1.15)}.pad button:active{transform:scale(.95)}
.pad .op{background:color-mix(in srgb,var(--ac) 28%,var(--tr));color:var(--ac)}.pad .eq{background:var(--ac);color:var(--on)}.pad .fn{color:var(--mu);font-size:15px}
#hist{margin:0 16px;max-height:150px;overflow:auto;border-top:1px solid var(--ln);padding:8px 0;text-align:right;color:var(--mu);font-size:13px}#hist div{padding:3px 6px;cursor:pointer}</style></head><body><div class="win" style="width:400px;height:610px"><div class="tb"><div class="dots"><i></i><i></i><i></i></div><span class="ttl">Lion Calculator</span><button class="ib" id="hb" title="History">⟲</button></div>
<div class="m"><button class="on" data-m="b">Basic</button><button data-m="s">Scientific</button></div>
<div class="disp"><div id="ex"></div><div id="rs">0</div></div><div id="hist" hidden></div><div class="pad" id="pad"></div></div><button class="ib" id="th" aria-label="Toggle theme" title="Theme">◐</button><script>document.getElementById("th").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"":"light"}</script><script>
const $=s=>document.querySelector(s);let e='',sci=0,H=[];
const B=[['AC','fn'],['⌫','fn'],['%','op'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['±','fn'],['0'],['.'],['=','eq']];
const S=[['sin(','fn'],['cos(','fn'],['tan(','fn'],['ln(','fn'],['√(','fn'],['π','fn'],['e','fn'],['^','op'],['(','fn'],[')','fn']];
function draw(){const p=$('#pad');p.className='pad'+(sci?' s':'');
const SL=['sin(','cos(','tan(','ln(','√(','π','e','(',')','÷','7','8','9','^','×','4','5','6','%','−','1','2','3','AC','+','±','0','.','⌫','='];
const cls=k=>k==='='?'eq':'÷×−+^%'.includes(k)?'op':/^[0-9.]$/.test(k)?'':'fn';
const L=sci?SL:B.map(b=>b[0]);p.innerHTML=L.map(k=>`<button class="${cls(k)}" data-k="${k}">${k}</button>`).join('')}
function calc(x){const j=x.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\^/g,'**').replace(/π/g,'Math.PI').replace(/√\(/g,'Math.sqrt(').replace(/\b(sin|cos|tan)\(/g,'Math.$1(').replace(/ln\(/g,'Math.log(').replace(/(\d+(\.\d+)?)%/g,'($1/100)').replace(/\be\b/g,'Math.E');
if(/[^0-9+\-*/.()\sMathPIEsqrtincoglnw,]/.test(j))throw 0;const v=Function('"use strict";return ('+j+')')();if(!isFinite(v))throw 0;return +v.toPrecision(12)}
function key(k){if(k==='AC')e='',$('#rs').textContent='0';else if(k==='⌫')e=e.slice(0,-1);else if(k==='±')e=e?(e[0]==='−'?e.slice(1):'−'+e):'';else if(k==='='){try{const r=calc(e);H.unshift(e+' = '+r);e=String(r).replace('-','−');$('#rs').textContent=e;$('#ex').textContent=H[0].split(' = ')[0];hist();return}catch(_){$('#rs').textContent='Error';e='';return}}else e+=k;
$('#ex').textContent='';$('#rs').textContent=e||'0';try{if(/[+\-−×÷^%]/.test(e.slice(1))&&e)$('#ex').textContent='= '+calc(e)}catch(_){}}
function hist(){$('#hist').innerHTML=H.slice(0,8).map(h=>`<div>${h}</div>`).join('')}
$('#pad').onclick=ev=>{const k=ev.target.dataset.k;if(k)key(k)};$('#hb').onclick=()=>{hist();$('#hist').hidden=!$('#hist').hidden;$('#hb').classList.toggle('on')};
$('#hist').onclick=ev=>{const t=ev.target.textContent;if(t){e=t.split(' = ')[1];key('')}};
document.querySelectorAll('.m button').forEach(b=>b.onclick=()=>{sci=b.dataset.m==='s'?1:0;document.querySelectorAll('.m button').forEach(x=>x.classList.toggle('on',x===b));draw()});
addEventListener('keydown',ev=>{const m={'*':'×','/':'÷','-':'−',Enter:'=',Backspace:'⌫',Escape:'AC'};const k=m[ev.key]||ev.key;if(/^[0-9.+()%^]$|^[×÷−=⌫]$|^AC$/.test(k)){ev.preventDefault();key(k)}});draw();</script></body></html>
