<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leonux OS - Notes Manager</title>
    <style>
        /**
         * LEONUX DESIGN SYSTEM - NOTES MANAGER SCALES
         */
        :root {
            --bg-body: #161617;
            --surface-base: rgba(30,30,31,0.84);
            --surface-panel: rgba(58,58,60,0.55);
            --surface-hover: rgba(245,245,247,0.08);
            --surface-active: rgba(245,245,247,0.13);
            --border-glass: rgba(245,245,247,0.09);
            --border-mid: rgba(245,245,247,0.17);
            
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            
            --accent: #dc73c2;
            --accent-glow: rgba(220,115,194,0.35);
            --danger: #ff7a85;
            --success: #7fd35a;
            --warning: #ffb85c;
            
            --shadow-win: 0 40px 100px -20px rgba(6,6,6,0.95);
            --glass-blur: blur(40px) saturate(180%);
            --radius-xl: clamp(16px, 2vh, 24px);
            --radius-l: clamp(8px, 1vh, 12px);
            --radius-pill: 9999px;
            --ease-leonux: cubic-bezier(0.2, 1, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .noise-layer {
            position: fixed; inset: 0; opacity: 0.03; pointer-events: none; z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
        /* App Main Shell Frame */
        .notes-frame {
            position: relative;
            width: 96vw;
            max-width: 1250px;
            height: 90vh;
            max-height: 850px;
            background: var(--surface-base);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-win);
            display: flex;
            flex-direction: column;
            z-index: 10;
            overflow: hidden;
            animation: window-open 0.6s var(--ease-leonux) forwards;
        }
        @keyframes window-open {
            from { opacity: 0; transform: scale(0.97) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        /* Top Nav Header bar */
        .header-nav {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-glass);
            background: rgba(10,10,10,0.2);
            justify-content: space-between;
        }
        .window-controls { display: flex; gap: 8px; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
        .win-close { background: #f75e73; }
        .win-min { background: #e5a648; }
        .win-max { background: #6ca34d; }
        .app-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        /* Workspace Core Layout Split */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        /* --- Panel A: Left Side Navigation (Notes Shelf) --- */
        .notes-shelf {
            width: 320px;
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            background: rgba(10,10,10,0.15);
            transition: transform 0.3s var(--ease-leonux), width 0.3s var(--ease-leonux);
            overflow: hidden;
            flex-shrink: 0;
        }
        .shelf-header {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid var(--border-glass);
        }
        .shelf-action-row {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
        }
        /* Search Form Input */
        .search-box-wrapper {
            position: relative;
            flex: 1;
        }
        .search-input {
            width: 100%;
            background: rgba(10,10,10,0.25);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 8px 12px 8px 36px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(220,115,194,0.15);
        }
        .search-icon {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            width: 14px; height: 14px; color: var(--text-muted); pointer-events: none;
        }
        /* Action triggers */
        .btn-new-note {
            background: var(--accent);
            border: none;
            color: var(--bg-body);
            border-radius: 8px;
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .btn-new-note:hover {
            background: #f093d7;
            box-shadow: 0 0 15px var(--accent-glow);
            transform: scale(1.03);
        }
        /* Folder Tags Index list */
        .tags-carousel {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 0 4px;
        }
        .tags-carousel::-webkit-scrollbar { display: none; }
        .tag-pill {
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            background: rgba(245,245,247,0.03);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .tag-pill:hover { color: var(--text-main); background: var(--surface-hover); }
        .tag-pill.active {
            background: rgba(220,115,194,0.15);
            border-color: var(--accent);
            color: var(--accent);
        }
        /* Note Items List Deck */
        .note-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .note-card {
            padding: 14px 16px;
            border-radius: var(--radius-l);
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s var(--ease-leonux);
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }
        .note-card:hover {
            background: var(--surface-hover);
        }
        .note-card.active {
            background: rgba(245,245,247,0.04);
            border-color: var(--border-glass);
        }
        .note-card.active::before {
            content: '';
            position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px;
            background: var(--accent); border-radius: 0 4px 4px 0;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .note-card-header {
            display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
        }
        .note-card-title {
            font-size: 14px; font-weight: 600; color: var(--text-main);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            flex: 1;
        }
        .btn-card-delete {
            opacity: 0; background: transparent; border: none; color: var(--text-muted);
            cursor: pointer; padding: 2px; border-radius: 4px; transition: 0.2s;
        }
        .note-card:hover .btn-card-delete { opacity: 1; }
        .btn-card-delete:hover { color: var(--danger); background: rgba(242,130,145,0.15); }
        .note-card-preview {
            font-size: 12px; color: var(--text-muted);
            line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden; word-break: break-all;
        }
        .note-card-footer {
            display: flex; justify-content: space-between; align-items: center; margin-top: 2px;
        }
        .note-card-time { font-size: 10px; color: var(--text-muted); font-family: monospace; }
        .note-card-tags { display: flex; gap: 4px; }
        .card-tag-badge {
            font-size: 9px; padding: 2px 6px; border-radius: 4px;
            background: rgba(245,245,247,0.05); color: var(--text-muted);
        }
        /* --- Panel B: Main Workspace Canvas --- */
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: transparent;
        }
        /* Main Workspace Control bar */
        .canvas-toolbar {
            height: 52px;
            border-bottom: 1px solid var(--border-glass);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10,10,10,0.1);
        }
        /* Mode Selector Toggle Switches */
        .workspace-toggles {
            display: flex; gap: 4px; background: rgba(10,10,10,0.15);
            padding: 4px; border-radius: 8px; border: 1px solid var(--border-glass);
        }
        .toggle-btn {
            background: transparent; border: none; color: var(--text-muted); font-size: 11px;
            font-weight: 600; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .toggle-btn svg { width: 14px; height: 14px; }
        .toggle-btn:hover { color: var(--text-main); }
        .toggle-btn.active { color: var(--text-main); background: rgba(245,245,247,0.08); }
        /* Formatting Helpers Toolbar inside content editing view */
        .format-bar {
            display: flex; gap: 6px; align-items: center;
        }
        .format-btn {
            background: transparent; border: none; color: var(--text-muted);
            width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center;
            justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .format-btn:hover { color: var(--text-main); background: var(--surface-hover); }
        .format-btn svg { width: 16px; height: 16px; }
        .format-divider {
            width: 1px; height: 16px; background: var(--border-glass); margin: 0 4px;
        }
        /* Active Editor Area - Configurable Dual Panes */
        .editor-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        /* Text Input Workspace */
        .pane-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s var(--ease-leonux);
            border-right: 1px solid var(--border-glass);
        }
        /* Custom Dynamic Title area inside editor */
        .title-strip {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .title-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 22px;
            font-weight: 700;
            outline: none;
        }
        .title-input::placeholder { color: var(--text-muted); opacity: 0.5; }
        
        .meta-strip {
            display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
        }
        .tag-editor-wrap {
            display: flex; gap: 6px; align-items: center;
        }
        .tag-input {
            background: transparent; border: none; color: var(--accent);
            font-size: 12px; outline: none; font-weight: 500;
            width: 110px;
        }
        .tag-input::placeholder { color: var(--text-muted); opacity: 0.5; }
        /* Document Editing Textarea Wrapper */
        .text-editing-area {
            flex: 1;
            position: relative;
            display: flex;
        }
        .textarea-main {
            flex: 1;
            height: 100%;
            background: transparent;
            border: none;
            resize: none;
            outline: none;
            color: var(--text-main);
            font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            padding: 24px;
            overflow-y: auto;
        }
        /* Live Preview HTML Engine Output Side-pane */
        .pane-preview {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: rgba(10,10,10,0.1);
            transition: all 0.3s var(--ease-leonux);
        }
        .preview-output {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.7;
            color: rgba(245,245,247,0.9);
        }
        /* --- Dynamic Pane Sizer Classes --- */
        .pane-editor.collapsed { display: none; }
        .pane-preview.collapsed { display: none; }
        /* Bottom status telemetries */
        .workspace-footer {
            height: 32px;
            border-top: 1px solid var(--border-glass);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(10,10,10,0.15);
        }
        .footer-telemetry { display: flex; gap: 16px; font-family: monospace; }
        .save-indicator { display: flex; align-items: center; gap: 6px; }
        .save-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--success); box-shadow: 0 0 8px var(--success);
        }
        .save-dot.unsaved {
            background: var(--warning); box-shadow: 0 0 8px var(--warning);
        }
        /* --- Custom Compiler CSS Output styles --- */
        .preview-output h1 { font-size: 28px; font-weight: 700; color: var(--text-main); margin: 20px 0 12px 0; border-bottom: 1px solid var(--border-glass); padding-bottom: 8px; }
        .preview-output h2 { font-size: 22px; font-weight: 600; color: var(--text-main); margin: 24px 0 12px 0; }
        .preview-output h3 { font-size: 18px; font-weight: 600; color: var(--text-main); margin: 20px 0 10px 0; }
        .preview-output h4 { font-size: 15px; font-weight: 600; color: var(--text-main); margin: 16px 0 8px 0; }
        .preview-output p { margin-bottom: 14px; }
        .preview-output strong { color: var(--text-main); }
        .preview-output em { color: rgba(245,245,247,0.8); }
        .preview-output del { opacity: 0.5; }
        .preview-output blockquote {
            border-left: 4px solid var(--accent);
            padding: 8px 16px; margin: 16px 0;
            background: rgba(220,115,194,0.05);
            border-radius: 0 8px 8px 0;
            color: var(--text-muted);
        }
        
        /* Code displays */
        .preview-output pre {
            background: #0b0b0b; border: 1px solid var(--border-glass); border-radius: 8px;
            padding: 16px; margin: 16px 0; overflow-x: auto;
            font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px;
        }
        .preview-output code {
            font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px;
            background: rgba(245,245,247,0.06); padding: 2px 6px; border-radius: 4px;
            color: var(--danger);
        }
        .preview-output pre code { background: transparent; padding: 0; color: #f093d7; }
        /* Tables */
        .preview-output table {
            width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 13px;
        }
        .preview-output th { background: rgba(31,31,31,0.9); padding: 10px 12px; border: 1px solid var(--border-glass); text-align: left; }
        .preview-output td { padding: 8px 12px; border: 1px solid var(--border-glass); }
        .preview-output tr:nth-child(even) { background: rgba(245,245,247,0.02); }
        /* Checklists */
        .preview-output .chk-item {
            display: flex; align-items: center; gap: 8px; list-style-type: none; margin-bottom: 4px;
        }
        .preview-output .chk-box {
            width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border-mid);
            background: rgba(10,10,10,0.3); display: flex; align-items: center; justify-content: center;
            color: var(--accent); flex-shrink: 0;
        }
        .preview-output .chk-box.checked {
            background: var(--accent); border-color: var(--accent); color: var(--bg-body);
        }
        .preview-output .chk-box svg { width: 12px; height: 12px; fill: currentColor; }
        .preview-output .chk-item.checked span { opacity: 0.5; text-decoration: line-through; }
        /* Standard lists */
        .preview-output ul, .preview-output ol { margin: 12px 0 16px 24px; }
        .preview-output li { margin-bottom: 6px; }
        .preview-output hr { border: none; height: 1px; background: var(--border-glass); margin: 24px 0; }
        
        /* Links */
        .preview-output a { color: var(--accent); text-decoration: none; transition: 0.2s; border-bottom: 1px dashed transparent; }
        .preview-output a:hover { border-bottom-color: var(--accent); }
        /* Alerts system */
        .preview-output .markdown-alert {
            padding: 12px 16px; border-radius: 8px; margin: 16px 0;
            border-left: 4px solid var(--border-glass); font-size: 13px;
        }
        .preview-output .markdown-alert-info { background: rgba(220,115,194,0.08); border-left-color: var(--accent); color: rgba(245,245,247,0.9); }
        .preview-output .markdown-alert-warning { background: rgba(237,193,128,0.08); border-left-color: var(--warning); color: rgba(245,245,247,0.9); }
        .preview-output .markdown-alert-title { font-weight: 700; margin-bottom: 4px; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        /* Media adjustments */
        @media (max-width: 768px) {
            .notes-frame { height: 100dvh; max-height: none; width: 100dvw; border-radius: 0; border: none; }
            .notes-shelf { position: absolute; left: 0; top: 52px; bottom: 0; z-index: 50; width: 100%; transform: translateX(-100%); }
            .notes-shelf.mobile-open { transform: translateX(0); }
        }
    </style>

                        <button class="toggle-btn" data-pane="split" id="toggle-pane-split"><svg><use href="#icon-split"></use></svg>Split</button>

    </main>

    <script>
        (function() {
            "use strict";

            // --- Predefined System Notes (Markdown Showcase) ---
            const defaultNotes = [
                {
                    id: "note-welcome",
                    title: "Welcome to Leonux Notes 🚀",
                    content: `# Welcome to Leonux Notes App!

This is a premium, high-fidelity **Markdown writing environment** designed directly for your workspace system ecosystem.

### Features Available:
* **Instant Compiler:** No external scripts or parsers. Fast markdown-to-HTML offline processing.
* **Tags Indexing:** Group and filter your files easily with dynamic category tags.
* **Auto-Save:** Everything is automatically backed up securely to LocalStorage.
* **Split Pane:** Toggle split views, dedicated editors, or fullscreen markdown rendering.

---

### Markdown Capabilities Showcase:

#### Checklists
- [x] This is a completed objective inside Leonux
- [ ] This objective is waiting for your attention
- [ ] Add category tags at the top menu!

#### Inline Code & syntax structures
You can write code blocks or highlight inline parameters. Here is a Javascript closure definition:

\`\`\`javascript
function initializeLeonux() {
    console.log("Core Boot Successful!");
    return { status: "ONLINE", battery: "100%" };
}
\`\`\`

#### Interactive Tables
| Core Component | Status | Speed Rating |
| :--- | :---: | ---: |
| Markdown Parser | Operational | < 1.2ms |
| Memory Storage | Sync Locked | Instant |
| UI Frame Rate | Active | 60 FPS |

#### Quote Blocks
> "Simplicity is the ultimate sophistication. By pairing robust clean styles with premium performance frameworks, we create experiences that truly last."

#### Inline Styles
Use **double asterisks for bold highlights**, *single asterisks for italic emphasis*, and ~~double wave dashes for deletions~~. Everything handles in real time!`,
                    tags: "welcome, guide",
                    updatedAt: Date.now()
                },
                {
                    id: "note-markdown-syntax",
                    title: "System Cheat Sheet 📝",
                    content: `# Notes Syntax Cheat Sheet

This note serves as a quick reference card for common formatting layouts.

## Headers Indexing
To compile standard headers, place hash elements at the beginning of the lines:
# Heading 1
## Heading 2
### Heading 3
#### Heading 4

## Alerts System Extensions
You can create beautifully aligned context alert banners with custom markdown-like identifiers:

> [!INFO]
> This represents a system info message container. It provides clear contextual help values!

> [!WARNING]
> This represents a high alert warning warning parameter. Handle configuration directories with care.

## Nested Lists
* Item level 1
    * Item level 2 nested list
        * Deeply nested components
* Sequential numbered lists:
    1. First task
    2. Second task`,
                    tags: "syntax, guide",
                    updatedAt: Date.now() - 3600000
                }
            ];

            // --- Application State ---
            let notes = [];
            let activeNoteId = null;
            let activePaneMode = "edit"; // 'edit', 'split', 'preview'
            let saveTimeout = null;

            // --- DOM Bindings ---
            const noteListEl = document.getElementById('note-list');
            const searchInputEl = document.getElementById('shelf-search');
            const tagCarouselEl = document.getElementById('tag-carousel');
            const btnCreateNote = document.getElementById('btn-create-note');
            const btnToggleShelf = document.getElementById('btn-toggle-shelf');
            const notesShelf = document.getElementById('notes-shelf');

            // Editor Bindings
            const editorTitle = document.getElementById('editor-title');
            const editorTags = document.getElementById('editor-tags');
            const editorTextarea = document.getElementById('editor-textarea');
            const previewOutput = document.getElementById('preview-output');

            const paneEditor = document.getElementById('pane-editor');
            const panePreview = document.getElementById('pane-preview');

            // Footer Telemetries
            const wordCountEl = document.getElementById('tel-word-count');
            const charCountEl = document.getElementById('tel-char-count');
            const saveDot = document.getElementById('save-dot');
            const saveStatusText = document.getElementById('save-status-text');

            // --- Real-time Markdown Compiler (Regex Engine) ---
            function compileMarkdown(md) {
                if (!md) return '';

                let html = md;

                // Escape HTML tags to protect sandbox structures against scripting injection
                html = html
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');

                // 1. Process Code Blocks (Multiline)
                html = html.replace(/```(\w*)\n([\s\S]*?)```/gm, function(match, lang, code) {
                    return `<pre><code class="language-${lang}">${code.trim()}</code></pre>`;
                });

                // 2. Custom Alerts parsing inside blockquotes
                html = html.replace(/^&gt;\s*\[!(INFO|WARNING)\]\n([\s\S]*?)(?=\n\n|\n&gt; [^ ]|\n\n|$)/gmi, function(match, type, content) {
                    const cleanContent = content.replace(/^&gt;\s?/gm, '').trim();
                    const alertClass = type.toLowerCase() === 'info' ? 'markdown-alert-info' : 'markdown-alert-warning';
                    return `<div class="markdown-alert ${alertClass}"><div class="markdown-alert-title">${type}</div><p>${cleanContent}</p></div>`;
                });

                // 3. Process Standard Blockquotes
                html = html.replace(/^&gt;\s?(.*)$/gm, '<blockquote>$1</blockquote>');
                // Consolidate contiguous quotes
                html = html.replace(/<\/blockquote>\n<blockquote>/g, '<br>');

                // 4. Checklists (checked and unchecked)
                html = html.replace(/^-\s+\[x\]\s+(.*)$/gmi, '<li class="chk-item checked"><div class="chk-box checked"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div><span>$1</span></li>');
                html = html.replace(/^-\s+\[\s*\]\s+(.*)$/gm, '<li class="chk-item"><div class="chk-box"></div><span>$1</span></li>');

                // 5. Unordered Lists
                html = html.replace(/^-\s+(.*)$/gm, '<li>$1</li>');
                html = html.replace(/(<li>.*<\/li>)/g, '<ul>$1</ul>');
                html = html.replace(/<\/ul>\s*<ul>/g, ''); // Join lists

                // 6. Ordered Lists
                html = html.replace(/^\d+\.\s+(.*)$/gm, '<li>$1</li>');
                html = html.replace(/(<li>.*<\/li>)/g, '<ol>$1</ol>');
                html = html.replace(/<\/ol>\s*<ol>/g, '');

                // 7. Headers (H1 to H4)
                html = html.replace(/^#\s+(.*)$/gm, '<h1>$1</h1>');
                html = html.replace(/^##\s+(.*)$/gm, '<h2>$1</h2>');
                html = html.replace(/^###\s+(.*)$/gm, '<h3>$1</h3>');
                html = html.replace(/^####\s+(.*)$/gm, '<h4>$1</h4>');

                // 8. Horizontal Lines
                html = html.replace(/^---$/gm, '<hr>');

                // 9. Process Tables
                html = html.replace(/^\|([\s\S]*?)\|$/gm, function(match, rowContent) {
                    const cells = rowContent.split('|').map(c => c.trim());
                    // Skip separators rows (like :---)
                    if (cells.every(c => /^:?-+:?$/.test(c))) return '';
                    
                    const isHeader = match.includes('---') || html.indexOf(match) < 200; // approximation
                    const cellTag = 'td'; // fallback
                    const formattedRow = cells.map(c => `<${cellTag}>${c}</${cellTag}>`).join('');
                    return `<tr>${formattedRow}</tr>`;
                });
                
                // Wrap structured table elements securely
                html = html.replace(/(<tr>[\s\S]*?<\/tr>)/g, '<table>$1</table>');
                html = html.replace(/<\/table>\s*<table>/g, '');

                // 10. Inline formats (Bold, Italic, Strike, Inline Code, Links)
                html = html.replace(/\*\*([\s\S]*?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*([\s\S]*?)\*/g, '<em>$1</em>');
                html = html.replace(/~~([\s\S]*?)~~/g, '<del>$1</del>');
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

                // Clean loose carriage returns safely
                html = html.replace(/\n/g, '<br>');

                return html;
            }

            // --- Database Core Handlers (LocalStorage) ---
            function loadDatabase() {
                try {
                    const stored = localStorage.getItem('leonux-notes-db');
                    if (stored) {
                        notes = JSON.parse(stored);
                    } else {
                        notes = [...defaultNotes];
                        saveDatabase();
                    }
                } catch (e) {
                    notes = [...defaultNotes];
                }
                
                if (notes.length > 0) {
                    activeNoteId = notes[0].id;
                }
                rebuildAppUI();
            }

            function saveDatabase() {
                localStorage.setItem('leonux-notes-db', JSON.stringify(notes));
                saveDot.className = "save-dot";
                saveStatusText.textContent = "All changes synced local";
            }

            function queueDatabaseAutoSave() {
                saveDot.className = "save-dot unsaved";
                saveStatusText.textContent = "Unsaved changes pending...";
                
                if (saveTimeout) clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    // Pull current inputs into system arrays before disk write
                    const activeNote = notes.find(n => n.id === activeNoteId);
                    if (activeNote) {
                        activeNote.title = editorTitle.value || "Untitled Document";
                        activeNote.content = editorTextarea.value;
                        activeNote.tags = editorTags.value;
                        activeNote.updatedAt = Date.now();
                        
                        saveDatabase();
                        rebuildNotesList();
                        rebuildTagCarousel();
                    }
                }, 1000); // 1-second auto save interval
            }

            // --- Document Creation & Purge Actions ---
            function createNewNote() {
                const newNote = {
                    id: 'note-' + Date.now(),
                    title: "Untitled Note",
                    content: "# Untitled Note\n\nWrite something details...",
                    tags: "personal",
                    updatedAt: Date.now()
                };

                notes.unshift(newNote);
                activeNoteId = newNote.id;
                saveDatabase();
                
                // Clear filters
                document.querySelectorAll('.tag-pill').forEach(p => p.classList.remove('active'));
                document.querySelector('.tag-pill[data-filter="all"]').classList.add('active');

                rebuildAppUI();
                editorTitle.focus();
            }

            function deleteNote(id, event) {
                if (event) event.stopPropagation();
                
                notes = notes.filter(n => n.id !== id);
                
                if (activeNoteId === id) {
                    activeNoteId = notes.length > 0 ? notes[0].id : null;
                }

                saveDatabase();
                rebuildAppUI();
            }

            // --- UI Compilation & Bindings ---
            function rebuildAppUI() {
                rebuildNotesList();
                rebuildTagCarousel();
                loadActiveNoteDetails();
            }

            function rebuildNotesList(filterTag = 'all', searchQuery = '') {
                noteListEl.innerHTML = '';
                
                let filtered = [...notes];
                
                if (filterTag !== 'all') {
                    filtered = filtered.filter(n => n.tags && n.tags.toLowerCase().includes(filterTag.toLowerCase()));
                }

                if (searchQuery.trim() !== '') {
                    const query = searchQuery.toLowerCase();
                    filtered = filtered.filter(n => 
                        n.title.toLowerCase().includes(query) || 
                        n.content.toLowerCase().includes(query)
                    );
                }

                if (filtered.length === 0) {
                    noteListEl.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">No matching records found.</div>`;
                    return;
                }

                filtered.forEach(note => {
                    const card = document.createElement('div');
                    card.className = `note-card ${note.id === activeNoteId ? 'active' : ''}`;
                    card.dataset.id = note.id;

                    const dateString = new Date(note.updatedAt).toLocaleDateString('en-US', {
                        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    // Format Tags Badges
                    const tagsArray = note.tags ? note.tags.split(',').map(t => t.trim()).filter(t => t) : [];
                    const tagsHtml = tagsArray.map(t => `<span class="card-tag-badge">${t}</span>`).slice(0, 2).join('');

                    // Extract first 80 characters of preview text
                    const plainPreview = note.content.replace(/[#*`~>[-]/g, '').slice(0, 80);

                    card.innerHTML = `
                        <div class="note-card-header">
                            <span class="note-card-title">${note.title || "Untitled Note"}</span>
                            <button class="btn-card-delete" data-id="${note.id}" title="Delete Note">
                                <svg width="14" height="14"><use href="#icon-trash"></use></svg>
                            </button>
                        </div>
                        <div class="note-card-preview">${plainPreview || "No content details..."}</div>
                        <div class="note-card-footer">
                            <span class="note-card-time">${dateString}</span>
                            <div class="note-card-tags">${tagsHtml}</div>
                        </div>
                    `;

                    card.addEventListener('click', () => {
                        activeNoteId = note.id;
                        rebuildNotesList(filterTag, searchQuery);
                        loadActiveNoteDetails();
                        
                        // Handle mobile responsive transitions
                        if (window.innerWidth <= 768) {
                            notesShelf.classList.remove('mobile-open');
                        }
                    });

                    // Bind delete selector inside card element
                    card.querySelector('.btn-card-delete').addEventListener('click', (e) => {
                        deleteNote(note.id, e);
                    });

                    noteListEl.appendChild(card);
                });
            }

            function rebuildTagCarousel() {
                // Collect and compile unique tags arrays
                const allTags = new Set();
                notes.forEach(note => {
                    if (note.tags) {
                        note.tags.split(',').forEach(tag => {
                            const trimmed = tag.trim().toLowerCase();
                            if (trimmed) allTags.add(trimmed);
                        });
                    }
                });

                // Preserve the "All Notes" item
                const activeFilterBtn = tagCarouselEl.querySelector('.tag-pill.active');
                const activeFilter = activeFilterBtn ? activeFilterBtn.dataset.filter : 'all';

                tagCarouselEl.innerHTML = `<button class="tag-pill ${activeFilter === 'all' ? 'active' : ''}" data-filter="all">All Notes</button>`;

                allTags.forEach(tag => {
                    const btn = document.createElement('button');
                    btn.className = `tag-pill ${activeFilter === tag ? 'active' : ''}`;
                    btn.dataset.filter = tag;
                    btn.textContent = tag.toUpperCase();
                    
                    btn.addEventListener('click', (e) => {
                        tagCarouselEl.querySelectorAll('.tag-pill').forEach(p => p.classList.remove('active'));
                        btn.classList.add('active');
                        rebuildNotesList(tag, searchInputEl.value);
                    });

                    tagCarouselEl.appendChild(btn);
                });
            }

            function loadActiveNoteDetails() {
                const activeNote = notes.find(n => n.id === activeNoteId);
                
                if (!activeNote) {
                    editorTitle.value = '';
                    editorTags.value = '';
                    editorTextarea.value = '';
                    previewOutput.innerHTML = `<div style="color:var(--text-muted); text-align:center; padding-top:40px;">Select or create a document to begin.</div>`;
                    
                    editorTitle.disabled = true;
                    editorTags.disabled = true;
                    editorTextarea.disabled = true;
                    return;
                }

                editorTitle.disabled = false;
                editorTags.disabled = false;
                editorTextarea.disabled = false;

                editorTitle.value = activeNote.title;
                editorTags.value = activeNote.tags || '';
                editorTextarea.value = activeNote.content || '';

                triggerLivePreviewRendering();
            }

            function triggerLivePreviewRendering() {
                const text = editorTextarea.value;
                previewOutput.innerHTML = compileMarkdown(text);
                
                // Real-time telemetry monitoring
                const cleanWordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
                wordCountEl.textContent = `${cleanWordCount} Words`;
                charCountEl.textContent = `${text.length} Characters`;
            }

            // --- Toolbar Markdown Helper injection functions ---
            function injectMarkdownMarker(before, after = '') {
                const startPos = editorTextarea.selectionStart;
                const endPos = editorTextarea.selectionEnd;
                const selectedText = editorTextarea.value.substring(startPos, endPos);
                
                const insertedText = before + selectedText + after;
                
                editorTextarea.value = 
                    editorTextarea.value.substring(0, startPos) + 
                    insertedText + 
                    editorTextarea.value.substring(endPos);

                editorTextarea.focus();
                editorTextarea.selectionStart = startPos + before.length;
                editorTextarea.selectionEnd = startPos + before.length + selectedText.length;
                
                triggerLivePreviewRendering();
                queueDatabaseAutoSave();
            }

            // Bind Toolbar selectors
            document.getElementById('fmt-bold').addEventListener('click', () => injectMarkdownMarker('**', '**'));
            document.getElementById('fmt-italic').addEventListener('click', () => injectMarkdownMarker('*', '*'));
            document.getElementById('fmt-link').addEventListener('click', () => injectMarkdownMarker('[', '](https://)'));
            document.getElementById('fmt-code').addEventListener('click', () => injectMarkdownMarker('```javascript\n', '\n```'));
            document.getElementById('fmt-quote').addEventListener('click', () => injectMarkdownMarker('> '));
            document.getElementById('fmt-chk').addEventListener('click', () => injectMarkdownMarker('- [ ] '));

            // --- Workspace Pane Mode Controls ---
            function applyPaneMode(mode) {
                activePaneMode = mode;
                
                // Update buttons active class
                document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                
                paneEditor.classList.remove('collapsed');
                panePreview.classList.add('collapsed');

                if (mode === 'edit') {
                    document.getElementById('toggle-pane-edit').classList.add('active');
                } else if (mode === 'split') {
                    document.getElementById('toggle-pane-split').classList.add('active');
                    panePreview.classList.remove('collapsed');
                } else if (mode === 'preview') {
                    document.getElementById('toggle-pane-preview').classList.add('active');
                    paneEditor.classList.add('collapsed');
                    panePreview.classList.remove('collapsed');
                }
            }

            document.getElementById('toggle-pane-edit').addEventListener('click', () => applyPaneMode('edit'));
            document.getElementById('toggle-pane-split').addEventListener('click', () => applyPaneMode('split'));
            document.getElementById('toggle-pane-preview').addEventListener('click', () => applyPaneMode('preview'));

            // --- Core Action Listeners ---
            editorTitle.addEventListener('input', queueDatabaseAutoSave);
            editorTags.addEventListener('input', queueDatabaseAutoSave);
            editorTextarea.addEventListener('input', () => {
                triggerLivePreviewRendering();
                queueDatabaseAutoSave();
            });

            btnCreateNote.addEventListener('click', createNewNote);
            
            searchInputEl.addEventListener('input', (e) => {
                const selectedTagPill = tagCarouselEl.querySelector('.tag-pill.active');
                const tagFilter = selectedTagPill ? selectedTagPill.dataset.filter : 'all';
                rebuildNotesList(tagFilter, e.target.value);
            });

            btnToggleShelf.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    notesShelf.classList.toggle('mobile-open');
                } else {
                    // Regular desktop toggle action (adjust shelf dimension width)
                    if (notesShelf.style.width === '0px') {
                        notesShelf.style.width = '320px';
                        notesShelf.style.borderRightWidth = '1px';
                    } else {
                        notesShelf.style.width = '0px';
                        notesShelf.style.borderRightWidth = '0px';
                    }
                }
            });

            // Note Exporter (Generates real .md files on user local downloads stack)
            document.getElementById('btn-export').addEventListener('click', () => {
                const activeNote = notes.find(n => n.id === activeNoteId);
                if (!activeNote) return;

                const blob = new Blob([activeNote.content], { type: 'text/markdown;charset=utf-8' });
                const blobUrl = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = `${activeNote.title.toLowerCase().replace(/[^a-z0-9]/g, '-')}.md`;
                document.body.appendChild(link);
                link.click();
                
                document.body.removeChild(link);
                URL.revokeObjectURL(blobUrl);
            });

            document.getElementById('btn-close-app').addEventListener('click', () => {
                document.querySelector('.notes-frame').style.animation = "window-open 0.4s var(--ease-leonux) reverse forwards";
                setTimeout(() => document.body.innerHTML = "<h2 style='color:var(--text-muted); font-weight:300;'>Notes Application Session Closed.</h2>", 400);
            });

            // Initialize app structures
            loadDatabase();

        })();
    </script>
