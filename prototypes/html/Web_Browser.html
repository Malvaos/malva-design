<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Browser</title><style>
:root{--bg:#161617;--sf:#1e1e1f;--tr:#3a3a3c;--ink:#f5f5f7;--mu:#8e8e93;--ac:#dc73c2;--on:#1d1d1f;--ln:rgba(245,245,247,.12);--dn:#ff7a85;--ok:#7fd35a;--wall:url(../../brand/wallpapers/malva-graphite-2560x1440.jpg)}
[data-theme=light]{--bg:#f5f5f7;--sf:#ffffff;--tr:#d1d1d6;--ink:#1d1d1f;--mu:#86868b;--ac:#8c3274;--on:#fff;--ln:rgba(29,29,31,.14);--dn:#d6414f;--ok:#3f8a1e;--wall:url(../../brand/wallpapers/malva-silver-2560x1440.jpg)}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{display:grid;place-items:center;background:var(--bg) var(--wall) center/cover fixed;color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.win{background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(30px);border:1px solid var(--ln);border-radius:14px;box-shadow:0 40px 90px -20px rgba(6,6,6,.6);overflow:hidden;display:flex;flex-direction:column}
.tb{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--ln);flex:none}
.dots{display:flex;gap:8px;margin-right:8px}.dots i{width:12px;height:12px;border-radius:50%;background:#d84a5a}.dots i:nth-child(2){background:#e0a838}.dots i:nth-child(3){background:#4a8a30}
.ttl{font-weight:600;font-size:13px;flex:1;text-align:center;color:var(--mu)}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--mu);transition:.15s}.ib:hover{background:var(--tr);color:var(--ink)}.ib.on{background:var(--ac);color:var(--on)}
#th{position:fixed;right:16px;bottom:16px;width:36px;height:36px;border:1px solid var(--ln);background:var(--sf);z-index:9}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style><style>
.tabs{display:flex;gap:6px;flex:1;overflow:hidden}.tab{display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;height:32px;min-width:120px;max-width:200px;border-radius:9px;background:transparent;color:var(--mu);font-size:13px;cursor:pointer}.tab.on{background:var(--tr);color:var(--ink)}.tab span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tab b{font-weight:400;opacity:.6}.tab b:hover{opacity:1}
.nb{display:flex;align-items:center;gap:4px;padding:8px 12px;border-bottom:1px solid var(--ln)}.url{flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;background:var(--tr);margin:0 6px}.url input{flex:1;background:none;border:0;color:var(--ink);font:inherit;outline:none}.url:focus-within{box-shadow:0 0 0 2px var(--ac)}
.bmk{display:flex;gap:18px;padding:6px 18px;font-size:12px;color:var(--mu);border-bottom:1px solid var(--ln)}.bmk a{cursor:pointer}.bmk a:hover{color:var(--ink)}
main{flex:1;overflow:auto;padding:40px 60px}.hero{text-align:center;margin:30px 0}.hero h1{font-size:44px;font-weight:300}.hero h1 b{color:var(--ac);font-weight:600}
.sb{display:block;margin:22px auto;width:min(560px,100%);height:46px;border-radius:23px;border:1px solid var(--ln);background:var(--tr);padding:0 20px;color:var(--ink);font:inherit;outline:none}.sb:focus{box-shadow:0 0 0 2px var(--ac)}
.sd{display:grid;grid-template-columns:repeat(4,110px);gap:18px;justify-content:center;margin-top:34px}.sd a{display:grid;gap:8px;justify-items:center;cursor:pointer;font-size:12px;color:var(--mu)}.sd i{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-style:normal;font-size:26px;background:var(--tr);color:var(--ac);transition:.15s}.sd a:hover i{background:var(--ac);color:var(--on);transform:translateY(-3px)}
article{max-width:680px;margin:0 auto}article h1{font-size:32px;margin-bottom:6px}article h2{margin:26px 0 8px}article p{color:var(--mu);line-height:1.7}article code{background:var(--tr);padding:2px 7px;border-radius:6px;color:var(--ac)}article .k{color:var(--ac);font-size:12px;letter-spacing:.1em;text-transform:uppercase}</style></head><body><div class="win" style="width:1180px;height:700px"><div class="tb" style="height:46px;padding-left:14px"><div class="dots"><i></i><i></i><i></i></div><div class="tabs" id="tabs"></div><button class="ib" id="nt" title="New tab">+</button></div>
<div class="nb"><button class="ib" id="bk" title="Back">‹</button><button class="ib" id="fw" title="Forward">›</button><button class="ib" id="rl" title="Reload">⟳</button><div class="url"><span id="lk">🔒</span><input id="ur" value="lion://start" aria-label="Address"></div><button class="ib" id="bm" title="Bookmark">☆</button></div>
<div class="bmk"><a data-u="lion://docs">LionOS Docs</a><a data-u="lion://about">About LionOS</a><a data-u="lion://start">Start</a></div><main id="pg"></main></div><button class="ib" id="th" aria-label="Toggle theme" title="Theme">◐</button><script>document.getElementById("th").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"":"light"}</script><script>
const $=s=>document.querySelector(s);const P={'lion://start':['Start',()=>`<div class="hero"><h1>Lion<b>OS</b> Browser</h1></div><input class="sb" placeholder="Search the web or enter an address" aria-label="Search"><div class="sd">${[['📄','Docs','docs'],['ℹ️','About','about'],['🗂','Files','start'],['🎵','Media','start'],['📝','Notes','start'],['⚙️','Settings','about'],['🛒','Store','start'],['💬','Chat','start']].map(s=>`<a data-u="lion://${s[2]}"><i>${s[0]}</i>${s[1]}</a>`).join('')}</div>`],
'lion://docs':['LionOS Docs',()=>`<article><div class="k">Documentation</div><h1>Getting started with LionOS</h1><p>LionOS is a from-scratch Linux desktop written entirely in Rust, with a Smithay-based Wayland compositor and the Malva design system.</p><h2>Install a package</h2><p>Use <code>clp install fastfetch</code> from the terminal, or drop a <code>.deb</code> onto the installer.</p><h2>Theming</h2><p>Malva ships a dark orchid theme and a light plum theme. Switch them in Settings → Appearance.</p></article>`],
'lion://about':['About LionOS',()=>`<article><div class="k">System</div><h1>About LionOS</h1><p>Kernel 6.12 · Wayland · Malva UI 1.0</p><h2>Hardware</h2><p>Intel Core i9-13900K · 32 GB RAM · NVIDIA RTX 4090 · 512 GB NVMe</p><h2>Updates</h2><p>Your system is up to date. Last checked today at 11:32 PM.</p></article>`]};
let T=[{u:'lion://start',h:['lion://start'],p:0},{u:'lion://docs',h:['lion://docs'],p:0}],A=0;
function render(){const t=T[A];$('#tabs').innerHTML=T.map((x,k)=>`<div class="tab${k===A?' on':''}" data-k="${k}"><span>${(P[x.u]||['New tab'])[0]}</span><b data-x="${k}" title="Close">×</b></div>`).join('');
$('#ur').value=t.u;$('#pg').innerHTML=(P[t.u]||P['lion://start'])[1]();$('#bk').style.opacity=t.p>0?1:.35;$('#fw').style.opacity=t.p<t.h.length-1?1:.35}
function nav(u){if(!u)return;if(!/^lion:\/\//.test(u))u=P[u]?u:'lion://start';const t=T[A];t.h=t.h.slice(0,t.p+1);t.h.push(u);t.p++;t.u=u;render()}
$('#tabs').onclick=e=>{const x=e.target.dataset.x;if(x!==undefined){T.splice(+x,1);if(!T.length)T=[{u:'lion://start',h:['lion://start'],p:0}];A=Math.min(A,T.length-1)}else if(e.target.closest('.tab'))A=+e.target.closest('.tab').dataset.k;render()};
$('#nt').onclick=()=>{T.push({u:'lion://start',h:['lion://start'],p:0});A=T.length-1;render()};
$('#bk').onclick=()=>{const t=T[A];if(t.p>0){t.p--;t.u=t.h[t.p];render()}};$('#fw').onclick=()=>{const t=T[A];if(t.p<t.h.length-1){t.p++;t.u=t.h[t.p];render()}};$('#rl').onclick=render;
$('#ur').onkeydown=e=>{if(e.key==='Enter')nav($('#ur').value.trim())};$('#bm').onclick=()=>$('#bm').textContent=$('#bm').textContent==='☆'?'★':'☆';
document.body.onclick=e=>{const a=e.target.closest('[data-u]');if(a)nav(a.dataset.u)};render();</script></body></html>
