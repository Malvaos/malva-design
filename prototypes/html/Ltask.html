<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leonux OS - Task Manager</title>

    <style>
        /**
         * LEONUX TASK MANAGER DESIGN SYSTEM
         */
        :root {
            --bg-body: #161617;
            --surface-base: rgba(30,30,31,0.84);
            --surface-panel: rgba(58,58,60,0.55);
            --surface-hover: rgba(var(--ov),0.08);
            --surface-active: rgba(var(--ov),0.13);
            --border-glass: rgba(var(--ov),0.09);
            --border-mid: rgba(var(--ov),0.17);
            
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            
            --accent: #dc73c2;
            --accent-glow: rgba(220,115,194,0.35);
            --danger: #ff7a85;
            --warning: #ffb85c; /* Network Upload Yellow */
            --success: #7fd35a; /* Network Download Green */
            --gpu-color: #f093d7;
            
            --shadow-win: 0 40px 100px -20px rgba(6,6,6,0.95);
            --glass-blur: blur(40px) saturate(180%);
            --radius-xl: clamp(16px, 2vh, 24px);
            --radius-l: clamp(8px, 1vh, 12px);
            --radius-pill: 9999px;
            --ease-leonux: cubic-bezier(0.2, 1, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surface-hover); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--surface-active); }

        .noise-layer {
            position: fixed; inset: 0; opacity: 0.03; pointer-events: none; z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* App Window */
        .task-frame {
            position: relative;
            width: 95vw;
            max-width: 1200px;
            height: 90vh;
            max-height: 850px;
            background: var(--surface-base);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-win);
            display: flex;
            flex-direction: column;
            z-index: 10;
            overflow: hidden;
            animation: window-open 0.6s var(--ease-leonux) forwards;
        }

        @keyframes window-open {
            from { opacity: 0; transform: scale(0.97) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Top Navigation */
        .header-nav {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-glass);
            gap: 24px;
            background: rgba(var(--ovd),0.25);
        }

        .window-controls { display: flex; gap: 8px; margin-right: 16px; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
        .win-close { background: #f75e73; }
        .win-min { background: #e5a648; }
        .win-max { background: #6ca34d; }

        .nav-tabs { display: flex; gap: 8px; }
        .nav-tab {
            background: transparent; border: none; color: var(--text-muted); font-size: 14px; font-weight: 600;
            padding: 8px 16px; border-radius: var(--radius-pill); cursor: pointer; transition: 0.3s;
        }
        .nav-tab:hover { color: var(--text-main); background: var(--surface-hover); }
        .nav-tab.active { color: var(--bg-body); background: var(--text-main); }

        /* Main Content Area */
        .content-area {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .tab-panel {
            position: absolute; inset: 0; padding: 20px;
            display: none; flex-direction: column; overflow: hidden;
            animation: fade-in 0.3s ease forwards;
        }
        .tab-panel.active { display: flex; }

        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Data Tables --- */
        .table-container { flex: 1; overflow-y: auto; background: var(--surface-panel); border-radius: var(--radius-l); border: 1px solid var(--border-glass); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { position: sticky; top: 0; background: #1b1b1b; color: var(--text-muted); padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--border-mid); z-index: 2; }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border-glass); color: var(--text-main); }
        tr:hover td { background: var(--surface-hover); }
        
        .proc-name { display: flex; align-items: center; gap: 12px; font-weight: 500; }
        .proc-icon { width: 24px; height: 24px; fill: var(--text-muted); }
        .val-high { color: var(--danger); font-weight: 600; }
        .val-med { color: var(--warning); }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: var(--surface-hover); }
        .status-running { color: var(--success); background: color-mix(in srgb,var(--success) 16%,transparent); }
        .status-stopped { color: var(--text-muted); }

        /* --- Performance Tab Layout --- */
        .perf-layout { display: flex; height: 100%; gap: 20px; width: 100%; }
        
        .perf-sidebar {
            width: 280px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto;
            border-right: 1px solid var(--border-glass); padding-right: 12px;
        }
        .perf-main {
            flex: 1; display: flex; flex-direction: column; background: var(--surface-panel);
            border-radius: var(--radius-l); border: 1px solid var(--border-glass); padding: 24px;
            overflow-y: auto; position: relative;
        }
        
        .hw-item {
            padding: 12px 16px; border-radius: var(--radius-l); border: 1px solid transparent;
            cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; gap: 6px;
            background: rgba(var(--ov),0.01);
        }
        .hw-item:hover { background: var(--surface-hover); }
        .hw-item.active { background: var(--surface-active); border-color: var(--border-mid); }
        
        .hw-header { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; }
        .hw-sparkline { height: 35px; width: 100%; margin-top: 4px; }
        .hw-stats { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); }

        /* Main Chart Controls & Header */
        .chart-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        .chart-title-area { display: flex; flex-direction: column; }
        .chart-title { font-size: 24px; font-weight: 600; }
        .chart-subtitle { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
        .chart-main-val { font-size: 32px; font-weight: 300; text-align: right; }
        
        /* Interactive Controls Container */
        .chart-control-bar {
            display: flex; gap: 8px; margin-bottom: 16px; background: rgba(var(--ovd),0.15);
            padding: 6px; border-radius: 8px; border: 1px solid var(--border-glass);
            align-self: flex-start;
        }
        .ctrl-btn {
            background: transparent; border: none; color: var(--text-muted); font-size: 12px;
            font-weight: 600; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .ctrl-btn:hover { color: var(--text-main); background: var(--surface-hover); }
        .ctrl-btn.active { color: var(--text-main); background: rgba(var(--ov),0.1); box-shadow: 0 2px 4px rgba(var(--ovd),0.1); }

        /* Dynamic Canvas Display Contexts */
        .main-canvas-wrapper {
            width: 100%; height: 260px; position: relative; border: 1px solid var(--border-glass);
            border-radius: 8px; background: rgba(var(--ovd),0.2); margin-bottom: 20px; overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }
        
        /* Multi-Chart and Split Panels Layouts */
        .canvas-split-container { display: none; flex-direction: column; gap: 12px; width: 100%; height: 260px; margin-bottom: 20px; }
        .canvas-split-container.active { display: flex; }
        .split-panel { flex: 1; position: relative; border: 1px solid var(--border-glass); border-radius: 8px; background: rgba(var(--ovd),0.2); overflow: hidden; }
        .split-label { position: absolute; top: 8px; left: 12px; font-size: 11px; color: var(--text-muted); z-index: 5; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}

        /* Thread History Grid View (CPU) */
        .cpu-thread-charts { display: none; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; width: 100%; height: 260px; overflow-y: auto; }
        .cpu-thread-charts.active { display: grid; }
        .thread-chart-wrapper { border: 1px solid var(--border-glass); border-radius: 6px; background: rgba(var(--ovd),0.25); height: 80px; position: relative; overflow: hidden; }
        .thread-chart-label { position: absolute; top: 4px; left: 6px; font-size: 10px; color: var(--text-muted); font-weight: 500; z-index: 2; }
        .thread-chart-val { position: absolute; top: 4px; right: 6px; font-size: 10px; color: var(--accent); font-weight: 600; z-index: 2; }

        /* Stats Grid Layout */
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 12px; }
        .stat-box { background: rgba(var(--ovd),0.2); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-glass); }
        .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-val { font-size: 16px; font-weight: 600; }

        /* Custom Toggle Switch for Forms/Tables */
        .toggle { position: relative; display: inline-block; width: 40px; height: 20px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: rgba(var(--ov),0.1); transition: .3s; border-radius: 20px; border: 1px solid var(--border-mid); }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: var(--text-muted); transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); border-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); background-color: var(--bg-body); }
    </style>

#tmdlg .opt b{display:block;font-size:14px;font-weight:600}
#tmdlg .opt small{font-size:12px;color:var(--muted)}
#tmdlg .chk{display:flex;align-items:center;gap:12px;min-height:44px;font-size:13px;cursor:pointer}
#tmdlg .dlg-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin:6px -24px 0;padding:14px 24px;border-top:1px solid var(--line)}
#tmdlg .field{display:flex;flex-direction:column;gap:6px}
#tmdlg .field label{font-size:12px;font-weight:600;color:var(--muted)}
#tmdlg .field .row2{display:flex;gap:8px}
#tmdlg .field input[type=text]{flex:1;min-width:0;height:44px;padding:0 14px;border:0;border-radius:8px;background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--accent);font-size:14px}
#tmdlg .recent{display:flex;flex-direction:column;border-radius:10px;background:var(--panel);box-shadow:0 0 0 1px var(--line);overflow:hidden}
#tmdlg .recent button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-top:1px solid var(--line);font-size:13px;font-weight:500}
#tmdlg .recent button:first-child{border-top:0}
#tmdlg .recent button:hover{background:var(--alt)}
#tmdlg .recent small{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
#tmdlg .recent .none{padding:12px 14px;font-size:13px;color:var(--muted)}
#tmdlg .ic.sm{width:26px;height:26px}
#tab-processes .toasts{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:5;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
#tab-processes .toast{padding:10px 16px;border-radius:10px;background:#26262B;color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3)}

#tab-processes button,#tmdlg button{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
#tab-processes h1,#tmdlg h2,#tmdlg p{margin:0}#tab-processes input,#tmdlg input{font:inherit;color:inherit}
#tab-processes,#tmdlg{font:400 14px/1.4 var(--font)}
.header-nav{background:var(--header-bg)}
.nav-tab.active,.nav-tab.active:hover{color:var(--on-accent);background:var(--accent)}
td{vertical-align:middle}
.proc-name{display:table-cell}
.proc-name .proc-icon{display:inline-block;vertical-align:middle;margin-right:12px}
th{background:var(--th-bg)}
.status-running{background:color-mix(in srgb,var(--success) 16%,transparent)}
.theme-btn{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--border-glass);background:var(--surface-hover);color:var(--text-main);display:grid;place-items:center;cursor:pointer;transition:.2s}
.theme-btn:hover{background:var(--surface-active)}
.theme-btn .sun{display:none}[data-theme="light"] .theme-btn .sun{display:block}[data-theme="light"] .theme-btn .moon{display:none}
#tab-processes{gap:14px;padding:20px 24px 14px}
#tab-processes .head h1{font-size:22px}
#tab-processes .search{flex:0 1 250px;margin:0}
#tab-processes .search input{width:100%;height:44px;border:0;border-radius:8px;background:var(--alt);padding:0 12px 0 36px;font-size:13px;color:var(--text);outline:none}
#tab-processes .search input:focus{box-shadow:0 0 0 2px var(--accent)}
#tab-processes .toast{background:var(--surface-base);color:var(--text-main);border:1px solid var(--border-mid);backdrop-filter:blur(20px)}
#tab-processes button:disabled{cursor:not-allowed;opacity:.5}
#tab-processes .t-body{scrollbar-width:thin}
#tmdlg{color:var(--text);margin:auto}

    <script>
        (function() {
            "use strict";

            // --- Styling Variables ---
            const colors = {};
            function readColors() {
                const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
                colors.cpu = g('--c-cpu'); colors.mem = g('--c-mem'); colors.disk = g('--c-disk'); colors.netUp = g('--c-netup'); colors.netDown = g('--c-netdown');
                colors.gpu = g('--c-gpu'); colors.swap = g('--c-swap'); colors.gpu2 = g('--c-gpu2'); colors.enc = g('--c-enc'); colors.dec = g('--c-dec');
                colors.text = g('--text-main'); colors.grid = 'rgba(' + g('--ov') + ',0.07)';
            }
            function withAlpha(hex, a) { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); return m ? `rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},${a})` : hex; }
            readColors();

            // --- Continuous telemetry simulated updates loop ---
            function cycleSystemSimulation() {
                // 1. CPU Telemetry Calculations
                const cpuStorage = HardwareDataStore.cpu;
                const lastAvg = cpuStorage.avgHist[HistoryLength - 1];
                const nextAvg = runJitter(lastAvg, 8, 5, 95);
                cpuStorage.avgHist.shift();
                cpuStorage.avgHist.push(nextAvg);

                for (let i = 0; i < 16; i++) {
                    const lastThreadVal = cpuStorage.threads[i][HistoryLength - 1];
                    const nextThreadVal = runJitter(lastThreadVal, 15, 2, 100);
                    cpuStorage.threads[i].shift();
                    cpuStorage.threads[i].push(nextThreadVal);
                }

                // 2. Memory Telemetry (Physically mapped RAM & Virtual SWAP swapfile)
                const memStorage = HardwareDataStore.mem;
                const nextRAM = runJitter(memStorage.ramHist[HistoryLength - 1], 1.5, 10, 95);
                const nextSwap = runJitter(memStorage.swapHist[HistoryLength - 1], 0.5, 2, 80);
                memStorage.ramHist.shift(); memStorage.ramHist.push(nextRAM);
                memStorage.swapHist.shift(); memStorage.swapHist.push(nextSwap);

                const ramInUseNum = (nextRAM / 100 * 32).toFixed(1);
                memStorage.stats.ramInUse = `${ramInUseNum} GB`;
                memStorage.stats.ramFree = `${(32 - ramInUseNum).toFixed(1)} GB`;
                
                const swapInUseNum = (nextSwap / 100 * 16).toFixed(1);
                memStorage.stats.swapInUse = `${swapInUseNum} GB`;
                memStorage.stats.swapFree = `${(16 - swapInUseNum).toFixed(1)} GB`;

                // 3. Disk telemetry for multiple mounts
                const diskStorage = HardwareDataStore.disk;
                diskStorage.disks.forEach(d => {
                    const lastD = d.hist[HistoryLength - 1];
                    const nextD = Math.random() < 0.25 ? runJitter(lastD, 20, 0, 100) : runJitter(lastD, 2, 0, 100);
                    d.hist.shift();
                    d.hist.push(nextD);

                    d.stats.read = nextD > 10 ? `${(nextD * 12.5).toFixed(1)} MB/s` : `${(nextD * 0.8).toFixed(1)} MB/s`;
                    d.stats.write = nextD > 10 ? `${(nextD * 4.2).toFixed(1)} MB/s` : `${(nextD * 0.3).toFixed(1)} MB/s`;
                });

                // 4. Network Telemetry I/O speeds (distinct Up/Down)
                const netStorage = HardwareDataStore.net;
                const nextDown = runJitter(netStorage.downHist[HistoryLength - 1], 15, 2, 100);
                const nextUp = runJitter(netStorage.upHist[HistoryLength - 1], 5, 1, 95);
                netStorage.downHist.shift(); netStorage.downHist.push(nextDown);
                netStorage.upHist.shift(); netStorage.upHist.push(nextUp);

                // Express rates inside structural stat arrays
                netStorage.stats.recv = `${(nextDown * 120).toFixed(0)} Kbps`;
                netStorage.stats.send = `${(nextUp * 35).toFixed(0)} Kbps`;

                // 5. GPU Telemetry details
                const gpuStorage = HardwareDataStore.gpu;
                const nextGPU = runJitter(gpuStorage.combinedHist[HistoryLength - 1], 4, 2, 98);
                gpuStorage.combinedHist.shift();
                gpuStorage.combinedHist.push(nextGPU);

                const next3D = runJitter(gpuStorage.engines.threeD[HistoryLength - 1], 6, 2, 100);
                const nextCopy = runJitter(gpuStorage.engines.copy[HistoryLength - 1], 1, 0, 40);
                const nextEnc = runJitter(gpuStorage.engines.videoEnc[HistoryLength - 1], 0.5, 0, 15);
                const nextDec = runJitter(gpuStorage.engines.videoDec[HistoryLength - 1], 0.5, 0, 20);

                gpuStorage.engines.threeD.shift(); gpuStorage.engines.threeD.push(next3D);
                gpuStorage.engines.copy.shift(); gpuStorage.engines.copy.push(nextCopy);
                gpuStorage.engines.videoEnc.shift(); gpuStorage.engines.videoEnc.push(nextEnc);
                gpuStorage.engines.videoDec.shift(); gpuStorage.engines.videoDec.push(nextDec);

                gpuStorage.stats.util = `${nextGPU.toFixed(0)}%`;
                gpuStorage.stats.temp = `${(40 + (nextGPU * 0.3)).toFixed(0)}°C`;

                // Update physical values on sidebar sparkline elements
                document.getElementById('sb-cpu-val').textContent = `${nextAvg.toFixed(0)}%`;
                document.getElementById('sb-mem-val').textContent = `${nextRAM.toFixed(0)}%`;
                
                const avgDiskActive = ((diskStorage.disks[0].hist[HistoryLength-1] + diskStorage.disks[1].hist[HistoryLength-1]) / 2).toFixed(0);
                document.getElementById('sb-disk-val').textContent = `${avgDiskActive}%`;
                
                document.getElementById('sb-net-val').textContent = `${(nextDown * 12).toFixed(0)}/${(nextUp * 3).toFixed(0)}K`;
                document.getElementById('sb-gpu-val').textContent = `${nextGPU.toFixed(0)}%`;

                // Process list simulated cycles
                if (window.__tmTick) window.__tmTick();

                // Dispatch repaint calls for graphs
                triggerTelemetryRepaint();
                renderSparklines();
            }

            // --- Custom Canvas Plotting Utility ---
            function plotLineGraph(canvas, datasetCollection, isFill = true) {
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                // Adjust width to scale crisp vectors on high definition screens
                const scaleFactor = window.devicePixelRatio || 1;
                const designWidth = canvas.clientWidth;
                const designHeight = canvas.clientHeight;
                
                if (canvas.width !== designWidth * scaleFactor || canvas.height !== designHeight * scaleFactor) {
                    canvas.width = designWidth * scaleFactor;
                    canvas.height = designHeight * scaleFactor;
                }
                
                ctx.save();
                ctx.scale(scaleFactor, scaleFactor);
                ctx.clearRect(0, 0, designWidth, designHeight);

                // Draw Grid Layout
                ctx.strokeStyle = colors.grid;
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 1; i < 4; i++) {
                    const y = designHeight * 0.25 * i;
                    ctx.moveTo(0, y);
                    ctx.lineTo(designWidth, y);
                }
                for (let i = 1; i < 10; i++) {
                    const x = designWidth * 0.1 * i;
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, designHeight);
                }
                ctx.stroke();

                // Plot Datasets
                datasetCollection.forEach(ds => {
                    const points = ds.data;
                    if (points.length === 0) return;

                    const spacingX = designWidth / (points.length - 1);
                    ctx.beginPath();
                    
                    // Constrain points to canvas height bounds safely
                    const getPixelY = (val) => designHeight - ((Math.min(100, Math.max(0, val)) / 100) * designHeight);
                    
                    ctx.moveTo(0, getPixelY(points[0]));
                    for (let i = 1; i < points.length; i++) {
                        ctx.lineTo(i * spacingX, getPixelY(points[i]));
                    }

                    ctx.strokeStyle = ds.lineColor || colors.text;
                    ctx.lineWidth = ds.lineWidth || 2;
                    ctx.lineJoin = 'round';
                    ctx.lineCap = 'round';
                    
                    if (ds.dashed) {
                        ctx.setLineDash(ds.dashed);
                    } else {
                        ctx.setLineDash([]);
                    }
                    
                    ctx.stroke();

                    // Optional Linear Gradient underneath line path
                    if (isFill && ds.fillColorGrad) {
                        ctx.lineTo(designWidth, designHeight);
                        ctx.lineTo(0, designHeight);
                        ctx.closePath();
                        
                        const grad = ctx.createLinearGradient(0, 0, 0, designHeight);
                        grad.addColorStop(0, withAlpha(ds.lineColor, 0.24));
                        grad.addColorStop(1, 'transparent');
                        ctx.fillStyle = grad;
                        ctx.fill();
                    }
                });

                ctx.restore();
            }

            // --- Sparklines Draw Orchestration ---
            function renderSparklines() {
                // CPU
                plotLineGraph(document.getElementById('spark-cpu'), [{
                    data: HardwareDataStore.cpu.avgHist, lineColor: colors.cpu

                // MEM
                plotLineGraph(document.getElementById('spark-mem'), [{
                    data: HardwareDataStore.mem.ramHist, lineColor: colors.mem
                }], false);

                // DISK (Combined System SSD average)

  var rel=p.related.map(function(r){return P[r]}).filter(Boolean);
  dlg.innerHTML='<form class="dlg" method="dialog" id="endForm"><div class="dlg-head"><span class="dlg-ico danger">'+ico('triangle-exclamation',20)+'</span><div><h2 id="dlgTitle">End “'+esc(p.name)+'”?</h2><p>Unsaved work in this app will be lost.</p></div></div>'+
   '<div class="target"><span class="ic">'+ico(p.icon,14)+'</span><span class="tx"><b>'+esc(p.name)+'</b><small>PID '+p.pid+(p.kids.length?', '+p.kids.length+' helper'+(p.kids.length>1?'s':''):'')+'</small></span><span class="cnt2">'+n+(n>1?' processes':' process')+' will end</span></div>'+
   '<fieldset><legend>How should it end?</legend>'+
   '<label class="opt"><input type="radio" name="how" value="term"'+(hung?'':' checked')+'><span><b>Quit gracefully</b><small>Ask the app to close and save its work first (SIGTERM).</small></span></label>'+
   '<label class="opt"><input type="radio" name="how" value="kill"'+(hung?' checked':'')+'><span><b>Force quit</b><small>Stop it right now. Use this if the app is not responding (SIGKILL).</small></span></label></fieldset>'+
   (rel.length?'<label class="chk"><input type="checkbox" id="endRel" checked>Also end related: '+esc(rel.map(function(r){return r.name}).join(', '))+'</label>':'')+
   '<div class="dlg-foot"><button type="button" class="btn" data-close autofocus>Cancel</button><button type="submit" class="btn solid-danger" id="endGo">'+(hung?'Force quit':'End task')+'</button></div></form>';
  var go=$('#endGo');$$('input[name=how]',dlg).forEach(function(r){r.addEventListener('change',function(){go.textContent=r.value==='kill'?'Force quit':'End task'})});
  $('#endForm').addEventListener('submit',function(){
    var how=$('input[name=how]:checked',dlg).value,both=$('#endRel')&&$('#endRel').checked,gone=n;
    var kill=function(i){var q=P[i];if(!q)return;q.kids.forEach(function(k){delete P[k]});delete P[i]};
    if(both)rel.forEach(function(r){gone+=1+r.kids.length;kill(r.id)});
    if(p.parent){var par=P[p.parent];if(par)par.kids=par.kids.filter(function(k){return k!==p.id})}
    kill(p.id);
    if(!P[S.sel])S.sel=null;snapshot();renderProc();
    toast('Ended “'+p.name+'” ('+gone+(gone>1?' processes':' process')+', '+(how==='kill'?'SIGKILL':'SIGTERM')+')')});
  dlg.showModal();
}
var RECENT=[['lion-terminal','terminal','Today'],['lion-files ~/Documents','folder','Yesterday'],['lion-notes','note-sticky','Mon'],['lion-calculator','calculator','Last week']];
function recentHtml(q){q=q.trim().toLowerCase();
  var l=RECENT.filter(function(r){return !q||r[0].toLowerCase().indexOf(q)>=0}).slice(0,3);
  return l.length?l.map(function(r){return '<button type="button" data-fill="'+esc(r[0])+'"><span class="ic sm">'+ico(r[1],12)+'</span>'+esc(r[0])+'<small>'+r[2]+'</small></button>'}).join(''):'<div class="none">No recent commands match.</div>'}
function openRun(){
  dlg.innerHTML='<form class="dlg" method="dialog" id="runForm"><div class="dlg-head"><span class="dlg-ico">'+ico('play',18)+'</span><div><h2 id="dlgTitle">Run new task</h2><p>Start a program, open a folder or run a command.</p></div></div>'+
   '<div class="field"><label for="cmd">Open</label><div class="row2"><input id="cmd" type="text" autocomplete="off" placeholder="Type a program name, folder or command"><button type="button" class="btn" id="browseBtn">'+ico('folder',13)+'Browse</button></div></div>'+
   '<div><div class="field"><label>Recent</label></div><div class="recent" id="recent" style="margin-top:6px">'+recentHtml('')+'</div></div>'+
   '<label class="chk"><input type="checkbox" id="runAdmin">Run with administrator privileges</label>'+
   '<div class="dlg-foot"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">'+ico('play',12)+'Run</button></div></form>';
  var inp=$('#cmd');
  inp.addEventListener('input',function(){$('#recent').innerHTML=recentHtml(inp.value)});
  $('#recent').addEventListener('click',function(e){var b=e.target.closest('[data-fill]');if(b){inp.value=b.dataset.fill;inp.focus();$('#recent').innerHTML=recentHtml(inp.value)}});
  $('#browseBtn').addEventListener('click',function(){toast('File browsing is not available in this preview')});
  $('#runForm').addEventListener('submit',function(e){
    var v=inp.value.trim();if(!v){e.preventDefault();inp.focus();toast('Type a program or command to run');return}
    var name=v.split(/\s+/)[0].replace(/^.*\//,''),pid=4000+Math.floor(rnd()*3000),admin=$('#runAdmin').checked;
    var icon=/term/.test(name)?'terminal':/file/.test(name)?'folder':/note/.test(name)?'note-sticky':/calc/.test(name)?'calculator':'play';
    P['n'+pid]={id:'n'+pid,name:name,icon:icon,group:'apps',pid:pid,user:admin?'root':'user',kids:[],flag:null,eff:false,cpu:0,mem:0,disk:0,net:0,related:[],b:{cpu:.5+rnd()*1.5,mem:40+rnd()*120,disk:0,net:0}};
    S.sel='n'+pid;S.q='';$('#q').value='';tick();snapshot();renderProc();
    var row=$('.row[data-id="'+S.sel+'"]');if(row)row.scrollIntoView({block:'nearest'});
    toast('Started '+name+' (PID '+pid+')')});
  dlg.showModal();
}
$('#endBtn').addEventListener('click',function(){if(S.sel)openEnd(S.sel)});
$('#runBtn').addEventListener('click',openRun);
$('#q').addEventListener('input',function(){S.q=this.value;snapshot();renderProc()});
sample();for(var bi=0;bi<8;bi++)tick();snapshot();renderProc();
window.__tmTick=function(){tick();if($('#tab-processes').classList.contains('active'))updProc()};
})();
</script>
</body>
</html>
