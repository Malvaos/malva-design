<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Networks - LionOS</title>
    <style>
        /* --- 1. LIONOS DESIGN SYSTEM --- */
        :root {
            /* Palette - Obsidian (Dark) */
            --bg-body: #0f060d;
            --bg-glass-card: rgba(var(--ov),0.04);
            --bg-glass-hover: rgba(var(--ov),0.08);
            --bg-glass-active: rgba(var(--ov),0.12);
            --bg-header: rgba(15,6,13,0.85);
            
            /* Text */
            --text-primary: rgba(var(--ov),0.95);
            --text-secondary: rgba(var(--ov),0.55);
            --text-tertiary: rgba(var(--ov),0.35);
            
            /* Accents */
            --accent-primary: #d859bf; 
            --accent-success: #5b8940;
            --accent-warn: #df9321;
            
            /* Borders */
            --border-subtle: 1px solid rgba(var(--ov),0.08);
            --border-separator: 1px solid rgba(var(--ov),0.05);
            
            /* Dimensions */
            --radius-window: 24px;
            --radius-card: 20px;
            --padding-page: 32px;
            
            /* Animation */
            --ease-fluid: cubic-bezier(0.2, 0.8, 0.2, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Light Mode */
        [data-theme="light"] {
            --bg-body: #eaa4dc;
            --bg-glass-card: rgba(var(--ov),0.75);
            --bg-glass-hover: rgba(var(--ov),0.9);
            --bg-glass-active: #f8f1f7;
            --bg-header: rgba(234,164,220,0.85);
            
            --text-primary: #0f060d;
            --text-secondary: rgba(15,6,13,0.6);
            --text-tertiary: rgba(15,6,13,0.4);
            
            --border-subtle: 1px solid rgba(15,6,13,0.06);
            --border-separator: 1px solid rgba(15,6,13,0.08);
        }

        /* --- 2. BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at 50% 0%, rgba(216,89,191,0.15) 0%, transparent 80%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
            transition: background 0.5s var(--ease-fluid);
        }

        .window-frame {
            width: 100%;
            max-width: 760px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: var(--padding-page);
            overflow-y: auto;
            scrollbar-width: none;
            animation: fadeInUp 0.6s var(--ease-fluid);
        }
        .window-frame::-webkit-scrollbar { display: none; }

        /* --- 3. HEADER --- */
        .header {
            display: flex; align-items: center; margin-bottom: 24px;
            position: sticky; top: 0; z-index: 20;
            background: var(--bg-header);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding-bottom: 16px;
            border-bottom: var(--border-separator);
            margin-left: -20px; margin-right: -20px; padding-left: 20px;
        }

        .btn-back {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--bg-glass-card); border: var(--border-subtle);
            color: var(--text-primary); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; margin-right: 16px;
        }
        .btn-back:hover { background: var(--bg-glass-hover); transform: translateX(-2px); }
        .page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }

        /* --- 4. HERO: SIGNAL VISUALIZER --- */
        .signal-hero {
            background: var(--bg-glass-card);
            border: var(--border-subtle);
            border-radius: var(--radius-window);
            padding: 32px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            min-height: 200px;
        }

        /* The Radar Animation */
        .radar-core {
            width: 12px; height: 12px; background: var(--accent-primary);
            border-radius: 50%; z-index: 2;
            box-shadow: 0 0 15px var(--accent-primary);
            position: relative;
        }
        
        .radar-ring {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid var(--accent-primary);
            border-radius: 50%;
            opacity: 0;
            animation: ripple 3s linear infinite;
        }
        .radar-ring:nth-child(1) { animation-delay: 0s; }
        .radar-ring:nth-child(2) { animation-delay: 1s; }
        .radar-ring:nth-child(3) { animation-delay: 2s; }

        .status-badge {
            margin-top: 24px; z-index: 2;
            background: rgba(216,89,191,0.1);
            color: var(--accent-primary);
            padding: 6px 16px; border-radius: 99px;
            font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
            border: 1px solid rgba(216,89,191,0.2);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; gap: 8px;
        }
        .status-dot { width: 6px; height: 6px; background: currentColor; border-radius: 50%; }

        .network-name {
            font-size: 28px; font-weight: 700; margin-top: 12px;
            z-index: 2; text-shadow: 0 2px 10px rgba(15,6,13,0.2);
        }
        .ip-address { font-family: 'SF Mono', monospace; font-size: 13px; color: var(--text-tertiary); margin-top: 4px; z-index: 2; }

        /* --- 5. GRID LAYOUT --- */
        .settings-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;
        }
        @media (max-width: 600px) { .settings-grid { grid-template-columns: 1fr; } }

        .card {
            background: var(--bg-glass-card); border: var(--border-subtle);
            border-radius: var(--radius-card); padding: 20px;
            display: flex; flex-direction: column; justify-content: space-between;
            min-height: 140px; cursor: pointer; transition: all 0.3s var(--ease-fluid);
            position: relative; overflow: hidden;
        }
        .card:hover { background: var(--bg-glass-hover); transform: translateY(-2px); }
        .card.active { background: var(--bg-glass-active); border-color: rgba(var(--ov),0.15); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-icon { 
            width: 40px; height: 40px; background: rgba(var(--ov),0.05); 
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: var(--text-primary); transition: background 0.3s;
        }
        .card.active .card-icon { background: var(--accent-primary); color: white; box-shadow: 0 4px 15px rgba(216,89,191,0.4); }

        .card-title { font-size: 16px; font-weight: 600; margin-top: 12px; }
        .card-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

        /* Toggle inside card */
        .card-toggle { pointer-events: none; } /* Visual only, card click handles it */
        .switch {
            width: 44px; height: 26px; background: rgba(var(--ov),0.1);
            border-radius: 99px; position: relative; transition: all 0.3s;
        }
        .switch::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 22px; height: 22px; background: white; border-radius: 50%;
            transition: transform 0.3s var(--ease-bounce);
        }
        .card.active .switch { background: var(--accent-primary); }
        .card.active .switch::after { transform: translateX(18px); }

        /* --- 6. NETWORK LIST (Expandable) --- */
        .network-list {
            background: var(--bg-glass-card); border: var(--border-subtle);
            border-radius: var(--radius-window); overflow: hidden;
            max-height: 0; opacity: 0; transition: all 0.5s var(--ease-fluid);
            margin-bottom: 24px;
        }
        .network-list.open { max-height: 500px; opacity: 1; margin-bottom: 24px; }

        .list-header {
            padding: 16px 24px; font-size: 13px; font-weight: 600; 
            color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;
            border-bottom: var(--border-separator); display: flex; justify-content: space-between;
        }
        .loader { width: 14px; height: 14px; border: 2px solid var(--text-tertiary); border-top-color: var(--text-primary); border-radius: 50%; animation: spin 1s linear infinite; }

        .net-item {
            padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: var(--border-separator); cursor: pointer; transition: background 0.2s;
        }
        .net-item:hover { background: var(--bg-glass-hover); }
        .net-item:last-child { border-bottom: none; }

        .net-info { display: flex; align-items: center; gap: 12px; }
        .signal-icon { width: 20px; color: var(--text-primary); }
        .lock-icon { width: 14px; color: var(--text-tertiary); }
        
        /* --- 7. DATA USAGE (Polygraph) --- */
        .data-card {
            background: var(--bg-glass-card); border: var(--border-subtle);
            border-radius: var(--radius-window); padding: 24px; margin-bottom: 24px;
        }
        
        .graph-container {
            display: flex; align-items: flex-end; justify-content: space-between;
            height: 100px; margin-top: 20px; gap: 8px;
        }
        .bar-col {
            flex: 1; background: rgba(var(--ov),0.05); border-radius: 4px;
            height: 100%; position: relative; overflow: hidden;
        }
        .bar-fill {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: var(--accent-primary); opacity: 0.6;
            border-radius: 4px; transition: height 1s var(--ease-fluid);
        }
        /* Highlight specific bars */
        .bar-col:nth-child(5) .bar-fill { background: var(--accent-success); opacity: 1; box-shadow: 0 0 10px rgba(91,137,64,0.4); }

        /* --- 8. ANIMATIONS --- */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes ripple {
            0% { width: 0; height: 0; opacity: 0.8; border-width: 4px; }
            100% { width: 300px; height: 300px; opacity: 0; border-width: 0px; }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>

<body>

    <div class="window-frame">
        
        <header class="header">
            <button class="btn-back" onclick="console.log('Back')" aria-label="Go Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h1 class="page-title">Networks</h1>
        </header>

        <!-- 1. HERO VISUALIZER -->
        <div class="signal-hero">
            <div class="radar-core"></div>
            <div class="radar-ring"></div>
            <div class="radar-ring"></div>
            <div class="radar-ring"></div>
            
            <div class="network-name" id="current-network">LionNet 5G</div>
            <div class="ip-address">192.168.1.42 • IPv6 Enabled</div>
            
            <div class="status-badge" id="conn-status">
                <div class="status-dot"></div>
                <span>Connected securely</span>
            </div>
        </div>

        <!-- 2. PRIMARY CONTROLS -->
        <div class="settings-grid">
            <!-- Wi-Fi Card -->
            <div class="card active" onclick="toggleWifi(this)">
                <div class="card-header">
                    <div class="card-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                    </div>
                    <div class="card-toggle">
                        <div class="switch"></div>
                    </div>
                </div>
                <div>
                    <div class="card-title">Wi-Fi</div>
                    <div class="card-subtitle" id="wifi-subtitle">LionNet 5G</div>
                </div>
            </div>

            <!-- Bluetooth Card -->
            <div class="card" onclick="toggleCard(this)">
                <div class="card-header">
                    <div class="card-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 5V2l5 5L7 17"></path></svg>
                    </div>
                    <div class="card-toggle">
                        <div class="switch"></div>
                    </div>
                </div>
                <div>
                    <div class="card-title">Bluetooth</div>
                    <div class="card-subtitle">Off</div>
                </div>
            </div>
            
            <!-- Airplane Mode -->
            <div class="card" onclick="toggleCard(this)">
                <div class="card-header">
                    <div class="card-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.7l-1.2 4 6 3.2-2 2-4-1.5L1 16l7.4 1.6c.7.1 1.4-.1 1.9-.5l7.6-7.4z"></path></svg>
                    </div>
                    <div class="card-toggle">
                        <div class="switch"></div>
                    </div>
                </div>
                <div>
                    <div class="card-title">Airplane Mode</div>
                    <div class="card-subtitle">Off</div>
                </div>
            </div>

            <!-- VPN -->
            <div class="card" onclick="toggleCard(this)">
                <div class="card-header">
                    <div class="card-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect><path d="M12 12h.01"></path></svg>
                    </div>
                    <div class="card-toggle">
                        <div class="switch"></div>
                    </div>
                </div>
                <div>
                    <div class="card-title">VPN</div>
                    <div class="card-subtitle">Not Connected</div>
                </div>
            </div>
        </div>

        <!-- 3. NETWORK LIST (Hidden Logic) -->
        <div class="network-list open" id="wifi-list">
            <div class="list-header">
                <span>Available Networks</span>
                <div class="loader"></div>
            </div>
            
            <!-- Items -->
            <div class="net-item" onclick="selectNet(this, 'Starlink_X2')">
                <div class="net-info">
                    <svg class="signal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                    <span>Starlink_X2</span>
                </div>
                <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>

            <div class="net-item" onclick="selectNet(this, 'Office_Guest')">
                <div class="net-info">
                    <svg class="signal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.6"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                    <span>Office_Guest</span>
                </div>
                 <!-- Open Network (No Lock) -->
            </div>
             <div class="net-item" onclick="selectNet(this, 'Mesh_Pod_1')">
                <div class="net-info">
                    <svg class="signal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.4"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                    <span>Mesh_Pod_1</span>
                </div>
                <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
        </div>

        <!-- 4. DATA USAGE -->
        <div class="data-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:16px; font-weight:600;">Data Usage</span>
                <span style="font-size:13px; color:var(--text-secondary);">Last 7 Days</span>
            </div>
            <div class="graph-container">
                <div class="bar-col"><div class="bar-fill" style="height: 30%"></div></div>
                <div class="bar-col"><div class="bar-fill" style="height: 45%"></div></div>
                <div class="bar-col"><div class="bar-fill" style="height: 25%"></div></div>
                <div class="bar-col"><div class="bar-fill" style="height: 60%"></div></div>
                <div class="bar-col"><div class="bar-fill" style="height: 85%"></div></div>
                <div class="bar-col"><div class="bar-fill" style="height: 50%"></div></div>
                <div class="bar-col"><div class="bar-fill" style="height: 40%"></div></div>
            </div>
            <div style="margin-top:12px; font-size:12px; color:var(--text-secondary); text-align:right;">
                Total: <span style="color:var(--text-primary); font-weight:600;">42.5 GB</span>
            </div>
        </div>

    </div>

    <script>
        // --- LOGIC ---
        
        function toggleWifi(card) {
            card.classList.toggle('active');
            const isActive = card.classList.contains('active');
            const list = document.getElementById('wifi-list');
            const subtitle = document.getElementById('wifi-subtitle');
            
            // Hero Visualizer Logic
            const heroName = document.getElementById('current-network');
            const radarRings = document.querySelectorAll('.radar-ring');
            const statusBadge = document.getElementById('conn-status');

            if(isActive) {
                // Expanding
                list.classList.add('open');
                subtitle.textContent = "LionNet 5G";
                heroName.textContent = "LionNet 5G";
                heroName.style.opacity = 1;
                radarRings.forEach(r => r.style.animation = 'ripple 3s linear infinite');
                statusBadge.style.opacity = 1;
                statusBadge.innerHTML = '<div class="status-dot"></div><span>Connected securely</span>';
                statusBadge.style.color = 'var(--accent-primary)';
                statusBadge.style.background = 'rgba(216,89,191,0.1)';
            } else {
                // Collapsing
                list.classList.remove('open');
                subtitle.textContent = "Off";
                heroName.textContent = "Disconnected";
                heroName.style.opacity = 0.5;
                radarRings.forEach(r => r.style.animation = 'none');
                radarRings.forEach(r => r.style.opacity = '0');
                
                statusBadge.innerHTML = '<div class="status-dot" style="background:var(--accent-warn)"></div><span>Offline</span>';
                statusBadge.style.color = 'var(--accent-warn)';
                statusBadge.style.background = 'rgba(223,147,33,0.1)';
            }
        }

        function toggleCard(card) {
            card.classList.toggle('active');
            const title = card.querySelector('.card-title').textContent;
            const subtitle = card.querySelector('.card-subtitle');
            
            if(card.classList.contains('active')) {
                if(title === "Airplane Mode") {
                    subtitle.textContent = "On";
                    // Visual logic: Disable others?
                } else {
                    subtitle.textContent = "On";
                }
            } else {
                subtitle.textContent = "Off";
            }
        }

        function selectNet(item, name) {
            // Simulate Connecting
            const originalText = item.querySelector('span').textContent;
            item.querySelector('span').textContent = "Connecting...";
            item.style.cursor = "wait";
            
            setTimeout(() => {
                // Connect
                document.getElementById('current-network').textContent = name;
                document.getElementById('wifi-subtitle').textContent = name;
                item.querySelector('span').textContent = name;
                item.style.cursor = "pointer";
                
                // Visual Flash
                const list = document.getElementById('wifi-list');
                list.classList.remove('open'); // Auto close list on connect? Or keep open? 
                // Let's keep open but scroll top
            }, 1000);
        }

        // Animate Bars on Load
        setTimeout(() => {
            document.querySelectorAll('.bar-fill').forEach(bar => {
                const h = bar.style.height;
                bar.style.height = '0%';
                setTimeout(() => bar.style.height = h, 100);
            });
        }, 300);

    </script>
