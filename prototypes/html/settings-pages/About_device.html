<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>About Device - LionOS</title>
    <style>
        /* --- 1. LIONOS DESIGN SYSTEM (Shared) --- */
        :root {
            /* Palette */
            --bg-body: #0a0a0a;
            --bg-glass-card: rgba(var(--ov),0.03);
            --bg-glass-hover: rgba(var(--ov),0.08);
            --bg-glass-active: rgba(var(--ov),0.12);
            
            /* Text */
            --text-primary: rgba(var(--ov),0.95);
            --text-secondary: rgba(var(--ov),0.55);
            --text-tertiary: rgba(var(--ov),0.3);
            
            /* Accents */
            --accent-primary: #d859bf;
            --accent-glow: rgba(216,89,191,0.5);
            
            /* Borders */
            --border-subtle: 1px solid rgba(var(--ov),0.08);
            --border-separator: 1px solid rgba(var(--ov),0.04);
            
            /* Dimensions */
            --radius-window: 24px;
            --radius-pill: 99px;
            --padding-page: 32px;
            
            /* Animation */
            --ease-fluid: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* --- 2. BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E"),
                              radial-gradient(circle at 50% 0%, #1a1a1a 0%, #0a0a0a 100%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .window-frame {
            width: 100%;
            max-width: 720px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: var(--padding-page);
            overflow-y: auto;
            scrollbar-width: none;
            animation: slideUp 0.6s var(--ease-fluid);
        }
        .window-frame::-webkit-scrollbar { display: none; }

        /* --- 3. HEADER --- */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(10,10,10,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding-bottom: 16px;
            border-bottom: var(--border-separator);
        }

        .btn-back {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--bg-glass-card);
            border: var(--border-subtle);
            color: var(--text-primary);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 16px;
        }
        .btn-back:hover { background: var(--bg-glass-hover); transform: translateX(-2px); }

        .page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }

        /* --- 4. HERO SECTION (Visual) --- */
        .device-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 0 48px 0;
            text-align: center;
        }

        .device-icon-wrapper {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            position: relative;
        }

        /* Animated Glow behind device */
        .device-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            background: var(--accent-primary);
            filter: blur(60px);
            opacity: 0.2;
            border-radius: 50%;
            animation: pulseGlow 4s infinite alternate;
        }

        .device-svg {
            width: 100%; height: 100%;
            color: var(--text-primary);
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 10px 20px rgba(10,10,10,0.5));
        }

        .device-name-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .device-name {
            font-size: 28px;
            font-weight: 700;
            background: transparent;
            border: none;
            color: var(--text-primary);
            text-align: center;
            outline: none;
            min-width: 50px;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .device-name:focus { background: var(--bg-glass-active); }
        
        .edit-icon { opacity: 0.4; cursor: pointer; transition: opacity 0.2s; }
        .edit-icon:hover { opacity: 1; }

        .device-model {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            background: rgba(var(--ov),0.05);
            padding: 4px 12px;
            border-radius: 99px;
        }

        /* --- 5. SETTINGS GROUPS --- */
        .settings-group {
            background: var(--bg-glass-card);
            border: var(--border-subtle);
            border-radius: var(--radius-window);
            overflow: hidden;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: var(--border-separator);
            font-size: 15px;
            position: relative;
            transition: background 0.2s;
        }
        
        .info-item:last-child { border-bottom: none; }
        
        /* Copyable Items */
        .copy-item { cursor: pointer; }
        .copy-item:hover { background: var(--bg-glass-hover); }
        .copy-item:active { background: var(--bg-glass-active); }

        .label { color: var(--text-secondary); }
        .value { font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
        .mono { font-family: 'SF Mono', 'Roboto Mono', monospace; font-size: 14px; letter-spacing: -0.5px; opacity: 0.9; }

        /* Copy Feedback Tooltip */
        .copy-feedback {
            position: absolute;
            right: 24px;
            background: var(--accent-primary);
            color: white;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            transform: translateY(5px);
        }
        .copy-item.copied .copy-feedback { opacity: 1; transform: translateY(0); }
        .copy-item.copied .value { opacity: 0; }

        /* --- 6. SOFTWARE UPDATE MODULE --- */
        .update-wrapper {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .os-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .os-logo {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #d859bf, #d345b7);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(216,89,191,0.4);
            font-weight: 800; font-size: 24px; color: white;
            text-shadow: 0 2px 4px rgba(10,10,10,0.3);
        }

        .os-info h3 { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
        .os-info p { font-size: 13px; color: var(--text-secondary); }

        .btn-update {
            width: 100%;
            padding: 14px;
            background: var(--bg-glass-hover);
            border: 1px solid rgba(var(--ov),0.1);
            border-radius: 14px;
            color: var(--accent-primary);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .btn-update:hover { background: var(--bg-glass-active); border-color: var(--accent-primary); }
        .btn-update:active { transform: scale(0.98); }
        
        /* Loading Spinner */
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(216,89,191,0.3);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        /* --- 7. ANIMATIONS --- */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            from { opacity: 0.15; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 0.3; transform: translate(-50%, -50%) scale(1.1); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
<style id="malva-tokens">

--text-primary:#f5f5f7;--text-secondary:#8e8e93;--text-tertiary:#848484;--accent-primary:#dc73c2;--accent-glow:rgba(220,115,194,.45);--accent-success:#7fd35a;--accent-warn:#ffb85c;--accent-danger:#ff7a85;--accent-purple:#b99cf0;--accent-cyan:#72c9d8;--accent-rose:#ff7a85;--accent-amber:#ffb85c;--accent-violet:#a592f2;--accent-eco:#7fd35a;--accent-perf:#dc73c2;--accent-pink:#f093d7;
--border-subtle:1px solid rgba(245,245,247,.12);--border-separator:1px solid rgba(245,245,247,.06)}
[data-theme="light"]{--ov:29,29,31;--bg-body:#f5f5f7;--bg-glass-card:rgba(255,255,255,.72);--bg-glass-hover:rgba(255,255,255,.9);--bg-glass-active:#ffffff;--bg-glass-panel:rgba(255,255,255,.85);--bg-header:rgba(245,245,247,.85);
--text-primary:#1d1d1f;--text-secondary:#86868b;--text-tertiary:#7c7c7c;--accent-primary:#8c3274;--accent-glow:rgba(140,50,116,.35);--accent-success:#3f8a1e;--accent-warn:#8a5300;--accent-danger:#d6414f;--accent-purple:#6a4bb5;--accent-cyan:#1f7f95;--accent-rose:#d6414f;--accent-amber:#8a5300;--accent-violet:#5b4bb5;--accent-eco:#3f8a1e;--accent-perf:#8c3274;--accent-pink:#a14c8c;

html,body{color:var(--text-primary)}.window-frame>*{flex-shrink:0}html.embedded,html.embedded body{background:transparent!important;background-image:none!important}
html.embedded .window-frame{max-width:none;padding:26px 34px}

</style></head>
<body>

    <div class="window-frame">
        
        <!-- Header -->
        <header class="header">
            <button class="btn-back" onclick="history.back()" aria-label="Go Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h1 class="page-title">About Device</h1>
        </header>

        <!-- Hero: Visual Representation -->
        <div class="device-hero">
            <div class="device-icon-wrapper">
                <div class="device-glow"></div>
                <!-- Stylized Laptop SVG -->
                <svg class="device-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2" fill="rgba(22,22,22,0.8)" stroke="rgba(var(--ov),0.2)"></rect>
                    <path d="M8 21h8" stroke-width="2"></path>
                    <path d="M12 17v4" stroke-width="2"></path>
                    <!-- Screen Content -->
                    <rect x="4" y="5" width="16" height="10" fill="url(#screenGradient)" stroke="none"></rect>
                    <defs>
                        <linearGradient id="screenGradient" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#d859bf" stop-opacity="0.3"/>
                            <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.8"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            
            <div class="device-name-group">
                <input type="text" value="LionBook Pro" class="device-name" spellcheck="false" id="deviceName">
                <svg class="edit-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" onclick="focusName()"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </div>
            <div class="device-model">Model X1 • 2024</div>
        </div>

        <!-- Group 1: Hardware Specs -->
        <div class="settings-group">
            <div class="info-item">
                <span class="label">Processor</span>
                <span class="value">Lion Silicon M2 <span style="font-size:11px; opacity:0.6; border:1px solid rgba(var(--ov),0.3); padding:0 4px; border-radius:4px;">ARM</span></span>
            </div>
            <div class="info-item">
                <span class="label">Memory</span>
                <span class="value">32 GB Unified</span>
            </div>
            <div class="info-item">
                <span class="label">Graphics</span>
                <span class="value">LionGPU 16-Core</span>
            </div>
            <div class="info-item copy-item" onclick="copyToClipboard(this, 'LBP-2024-X992')">
                <span class="label">Serial Number</span>
                <span class="value mono">LBP-2024-X992</span>
                <span class="copy-feedback">Copied!</span>
            </div>
        </div>

        <!-- Group 2: Software & Updates -->
        <div class="settings-group">
            <div class="update-wrapper">
                <div class="os-header">
                    <div class="os-logo">L</div>
                    <div class="os-info">
                        <h3>LionOS 2.0</h3>
                        <p>Build 21C62 • Kernel 6.5.0</p>
                    </div>
                </div>
                
                <button class="btn-update" id="checkUpdateBtn" onclick="checkUpdate()">
                    <span class="btn-text">Check for Updates</span>
                    <div class="spinner"></div>
                </button>
            </div>
        </div>

        <!-- Group 3: Legal -->
        <div class="settings-group">
            <div class="info-item">
                <span class="label">Warranty</span>
                <span class="value" style="color: var(--accent-primary);">Active until Oct 2025</span>
            </div>
            <div class="info-item copy-item" onclick="window.location.href='#'">
                <span class="label">Legal & Regulatory</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-opacity="0.5"><path d="M9 18l6-6-6-6"/></svg>
            </div>
        </div>

    </div>

    <script>
        // --- 1. COPY FUNCTIONALITY ---
        function copyToClipboard(element, text) {
            navigator.clipboard.writeText(text).then(() => {
                // Visual Feedback class
                element.classList.add('copied');
                setTimeout(() => {
                    element.classList.remove('copied');
                }, 2000);
            });
        }

        // --- 2. UPDATE CHECK SIMULATION ---
        function checkUpdate() {
            const btn = document.getElementById('checkUpdateBtn');
            const text = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.spinner');

            if(btn.disabled) return;

            // Loading State
            text.textContent = "Checking...";
            spinner.style.display = 'block';
            btn.style.cursor = 'default';
            btn.disabled = true;

            setTimeout(() => {
                // Success State
                text.textContent = "LionOS is up to date";
                spinner.style.display = 'none';
                btn.style.color = '#5b8940'; // Success Green
                btn.style.borderColor = '#5b8940';
                btn.style.background = 'rgba(91,137,64,0.1)';
                
                // Reset after 3 seconds
                setTimeout(() => {
                    text.textContent = "Check for Updates";
                    btn.style.color = '';
                    btn.style.borderColor = '';
                    btn.style.background = '';
                    btn.disabled = false;
                    btn.style.cursor = 'pointer';
                }, 3000);
            }, 2000);
        }

        // --- 3. RENAME FOCUS ---
        function focusName() {
            document.getElementById('deviceName').focus();
        }

        // --- 4. DEVICE NAME INPUT HANDLER ---
        const nameInput = document.getElementById('deviceName');
        nameInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                this.blur();
                // Simulation of saving
                this.style.color = '#5b8940';
                setTimeout(() => this.style.color = '', 500);
            }
        });

    </script>
<script>(function(){if(self!==top)document.documentElement.classList.add('embedded');addEventListener('message',function(e){var t=e.data&&e.data.malvaTheme;if(t)document.documentElement.setAttribute('data-theme',t)})})();</script></body>
</html>
