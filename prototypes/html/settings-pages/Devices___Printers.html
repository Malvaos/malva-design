<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Devices - LionOS</title>
    <style>
        /* --- 1. LIONOS DESIGN SYSTEM --- */
        :root {
            /* Palette - Obsidian (Dark) */
            --bg-body: #0a0a0a;
            --bg-glass-card: rgba(var(--ov),0.04);
            --bg-glass-hover: rgba(var(--ov),0.08);
            --bg-glass-active: rgba(var(--ov),0.12);
            --bg-header: rgba(10,10,10,0.85);
            
            /* Text */
            --text-primary: rgba(var(--ov),0.96);
            --text-secondary: rgba(var(--ov),0.6);
            --text-tertiary: rgba(var(--ov),0.35);
            
            /* Accents */
            --accent-primary: #d859bf; 
            --accent-success: #5b8940;
            --accent-warn: #df9321;
            --accent-danger: #ef445b;
            --accent-purple: #dc73c2;
            
            /* Borders */
            --border-subtle: 1px solid rgba(var(--ov),0.08);
            --border-separator: 1px solid rgba(var(--ov),0.05);
            
            /* Dimensions */
            --radius-window: 28px;
            --radius-card: 20px;
            --padding-page: 40px;
            --max-width: 800px;
            
            /* Animation */
            --ease-fluid: cubic-bezier(0.2, 0.8, 0.2, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Light Mode */
        [data-theme="light"] {
            --bg-body: #f093d7;
            --bg-glass-card: rgba(var(--ov),0.7);
            --bg-glass-hover: rgba(var(--ov),0.9);
            --bg-glass-active: #f5f5f7;
            --bg-header: rgba(240,147,215,0.85);
            
            --text-primary: #111111;
            --text-secondary: rgba(10,10,10,0.6);
            --text-tertiary: rgba(10,10,10,0.4);
            
            --border-subtle: 1px solid rgba(10,10,10,0.05);
            --border-separator: 1px solid rgba(10,10,10,0.06);
        }

        /* --- 2. BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at 50% 0%, rgba(216,89,191,0.08) 0%, transparent 80%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
            transition: background 0.5s var(--ease-fluid);
        }

        .window-frame {
            width: 100%;
            max-width: var(--max-width);
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 0 var(--padding-page);
            overflow-y: auto;
            scrollbar-width: none;
            animation: fadeInUp 0.6s var(--ease-fluid);
        }
        .window-frame::-webkit-scrollbar { display: none; }

        /* --- 3. HEADER --- */
        .header {
            display: flex; align-items: center; 
            padding: 20px 0;
            position: sticky; top: 0; z-index: 20;
            background: var(--bg-header);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: var(--border-separator);
            margin: 0 calc(var(--padding-page) * -1) 32px calc(var(--padding-page) * -1);
            padding-left: var(--padding-page); padding-right: var(--padding-page);
        }

        .btn-back {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--bg-glass-card); border: var(--border-subtle);
            color: var(--text-primary); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; margin-right: 16px; flex-shrink: 0;
        }
        .btn-back:hover { background: var(--bg-glass-hover); transform: translateX(-2px); }
        .page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }

        /* --- 4. HERO: ADD DEVICE SCANNER --- */
        .scan-hero {
            background: var(--bg-glass-card);
            border: var(--border-subtle);
            border-radius: var(--radius-window);
            padding: 32px; margin-bottom: 32px;
            display: flex; align-items: center; justify-content: space-between;
            position: relative; overflow: hidden;
            cursor: pointer;
            transition: background 0.3s;
        }
        .scan-hero:hover { background: var(--bg-glass-hover); }
        .scan-hero:active { transform: scale(0.99); }

        .scan-info { z-index: 2; }
        .scan-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .scan-desc { font-size: 14px; color: var(--text-secondary); }

        .scan-visual {
            width: 48px; height: 48px;
            background: var(--accent-primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; position: relative;
            box-shadow: 0 0 20px rgba(216,89,191,0.4);
        }
        
        .pulse {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            border: 2px solid var(--accent-primary);
            border-radius: 50%;
            opacity: 0;
            animation: pulse-ring 2s infinite;
        }

        /* --- 5. DEVICE GRID (Peripherals) --- */
        .section-label {
            font-size: 12px; font-weight: 700; color: var(--text-secondary);
            margin-bottom: 14px; letter-spacing: 0.08em; text-transform: uppercase;
            padding-left: 12px;
        }

        .device-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px;
        }
        @media (max-width: 600px) { .device-grid { grid-template-columns: 1fr; } }

        .device-card {
            background: var(--bg-glass-card); border: var(--border-subtle);
            border-radius: var(--radius-card); padding: 20px;
            display: flex; flex-direction: column; gap: 16px;
            transition: all 0.3s var(--ease-fluid);
            position: relative; overflow: hidden;
            cursor: pointer;
        }
        .device-card:hover { background: var(--bg-glass-hover); transform: translateY(-2px); }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .device-icon {
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: white;
        }
        .icon-keyboard { background: var(--accent-purple); }
        .icon-mouse { background: var(--accent-warn); }
        .icon-audio { background: var(--accent-success); }

        .battery-pill {
            font-size: 11px; font-weight: 600;
            padding: 4px 8px; border-radius: 99px;
            background: rgba(var(--ov),0.1);
            color: var(--text-secondary);
            display: flex; align-items: center; gap: 4px;
        }
        .battery-pill.low { color: var(--accent-danger); background: rgba(239,68,91,0.15); }

        .card-info { display: flex; flex-direction: column; gap: 2px; }
        .device-name { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .device-status { font-size: 13px; color: var(--text-secondary); }

        /* --- 6. PRINTER LIST --- */
        .list-group {
            background: var(--bg-glass-card); border: var(--border-subtle);
            border-radius: var(--radius-window); overflow: hidden; margin-bottom: 32px;
        }

        .list-item {
            padding: 20px 24px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: var(--border-separator); cursor: pointer; transition: background 0.2s;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { background: var(--bg-glass-hover); }

        .item-left { display: flex; align-items: center; gap: 16px; }
        .printer-icon {
            width: 44px; height: 44px; background: rgba(var(--ov),0.05);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary);
        }
        
        .printer-meta { display: flex; flex-direction: column; gap: 2px; }
        .printer-name { font-weight: 600; font-size: 15px; }
        .printer-status { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
        
        .status-dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot-green { background: var(--accent-success); box-shadow: 0 0 8px rgba(91,137,64,0.4); }
        .dot-red { background: var(--accent-danger); }
        .dot-gray { background: var(--text-tertiary); }

        /* Ink Levels */
        .ink-wrapper { display: flex; gap: 4px; align-items: flex-end; height: 24px; width: 40px; }
        .ink-bar { width: 8px; border-radius: 2px; background: #333333; position: relative; overflow: hidden; height: 100%; }
        .ink-fill { position: absolute; bottom: 0; left: 0; width: 100%; transition: height 1s; }
        .ink-c { background: cyan; }
        .ink-m { background: magenta; }
        .ink-y { background: yellow; }
        .ink-k { background: #222222; } /* Black ink */

        /* --- 7. BUTTONS --- */
        .btn-text {
            color: var(--accent-primary); font-size: 13px; font-weight: 500;
            cursor: pointer; background: transparent; border: none;
        }
        .btn-text:hover { text-decoration: underline; }

        /* --- 8. ANIMATIONS --- */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-ring { 
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>

<body>

    <div class="window-frame">
        
        <header class="header">
            <button class="btn-back" onclick="console.log('Back')" aria-label="Go Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h1 class="page-title">Devices & Printers</h1>
        </header>

        <!-- HERO: ADD DEVICE -->
        <div class="scan-hero" onclick="startScan()">
            <div class="scan-info">
                <div class="scan-title" id="scan-title">Add New Device</div>
                <div class="scan-desc" id="scan-desc">Bluetooth, Wireless, or USB</div>
            </div>
            <div class="scan-visual" id="scan-visual">
                <div class="pulse"></div>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
        </div>

        <!-- 1. PERIPHERALS -->
        <div class="section-label">Connected Peripherals</div>
        <div class="device-grid" id="peripheral-list">
            
            <!-- Keyboard -->
            <div class="device-card">
                <div class="card-top">
                    <div class="device-icon icon-keyboard">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="6" y2="8"></line><line x1="10" y1="8" x2="10" y2="8"></line><line x1="14" y1="8" x2="14" y2="8"></line><line x1="18" y1="8" x2="18" y2="8"></line><line x1="6" y1="12" x2="6" y2="12"></line><line x1="10" y1="12" x2="10" y2="12"></line><line x1="14" y1="12" x2="14" y2="12"></line><line x1="18" y1="12" x2="18" y2="12"></line><line x1="7" y1="16" x2="17" y2="16"></line></svg>
                    </div>
                    <div class="battery-pill">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect><line x1="23" y1="13" x2="23" y2="11"></line></svg>
                        84%
                    </div>
                </div>
                <div class="card-info">
                    <div class="device-name">LionKey Pro</div>
                    <div class="device-status">Connected via Bluetooth</div>
                </div>
            </div>

            <!-- Mouse -->
            <div class="device-card">
                <div class="card-top">
                    <div class="device-icon icon-mouse">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="3" width="12" height="18" rx="5" ry="5"></rect><line x1="12" y1="7" x2="12" y2="11"></line></svg>
                    </div>
                    <div class="battery-pill low">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect><line x1="23" y1="13" x2="23" y2="11"></line></svg>
                        12%
                    </div>
                </div>
                <div class="card-info">
                    <div class="device-name">LionMouse X</div>
                    <div class="device-status">Low Battery</div>
                </div>
            </div>

        </div>

        <!-- 2. PRINTERS -->
        <div class="section-label">Printers & Scanners</div>
        <div class="list-group">
            
            <!-- Printer 1 -->
            <div class="list-item" onclick="printTestPage()">
                <div class="item-left">
                    <div class="printer-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    </div>
                    <div class="printer-meta">
                        <div class="printer-name">HP LaserJet Pro M404</div>
                        <div class="printer-status" id="printer-status-1"><div class="status-dot dot-green"></div>Ready</div>
                    </div>
                </div>
                <div class="ink-wrapper">
                    <div class="ink-bar"><div class="ink-fill ink-k" style="height: 60%"></div></div>
                </div>
            </div>

            <!-- Printer 2 -->
            <div class="list-item">
                <div class="item-left">
                    <div class="printer-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    </div>
                    <div class="printer-meta">
                        <div class="printer-name">Canon PIXMA TS</div>
                        <div class="printer-status"><div class="status-dot dot-gray"></div>Offline</div>
                    </div>
                </div>
                <div class="ink-wrapper">
                    <div class="ink-bar"><div class="ink-fill ink-c" style="height: 40%"></div></div>
                    <div class="ink-bar"><div class="ink-fill ink-m" style="height: 20%"></div></div>
                    <div class="ink-bar"><div class="ink-fill ink-y" style="height: 80%"></div></div>
                    <div class="ink-bar"><div class="ink-fill ink-k" style="height: 55%"></div></div>
                </div>
            </div>

        </div>

    </div>

    <script>
        // --- 1. SCANNER SIMULATION ---
        let isScanning = false;

        function startScan() {
            if(isScanning) return;
            isScanning = true;

            const title = document.getElementById('scan-title');
            const desc = document.getElementById('scan-desc');
            const visual = document.getElementById('scan-visual');
            const originalIcon = visual.innerHTML;

            title.textContent = "Scanning...";
            desc.textContent = "Looking for nearby devices";
            visual.innerHTML = '<svg style="animation: spin 1s linear infinite;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
            visual.style.background = "var(--bg-glass-active)";
            visual.style.color = "var(--text-primary)";

            // Simulate finding a device
            setTimeout(() => {
                title.textContent = "No New Devices Found";
                desc.textContent = "Ensure device is in pairing mode";
                visual.style.background = "var(--accent-warn)";
                visual.style.color = "white";
                visual.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';

                // Reset
                setTimeout(() => {
                    title.textContent = "Add New Device";
                    desc.textContent = "Bluetooth, Wireless, or USB";
                    visual.style.background = "var(--accent-primary)";
                    visual.innerHTML = originalIcon;
                    isScanning = false;
                }, 3000);
            }, 2500);
        }

        // --- 2. PRINTER ACTION ---
        function printTestPage() {
            const status = document.getElementById('printer-status-1');
            const originalHTML = status.innerHTML;

            status.innerHTML = '<div class="status-dot" style="background:var(--accent-primary); box-shadow:none;"></div>Printing Test Page...';
            status.style.color = "var(--accent-primary)";

            setTimeout(() => {
                status.innerHTML = originalHTML;
                status.style.color = "";
                alert("Test page sent to HP LaserJet Pro M404");
            }, 2000);
        }

    </script>
<script>(function(){if(self!==top)document.documentElement.classList.add('embedded');addEventListener('message',function(e){var t=e.data&&e.data.malvaTheme;if(t)document.documentElement.setAttribute('data-theme',t)})})();</script></body>
