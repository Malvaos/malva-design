<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leonux OS - File Manager</title>

    <style>
        /**
         * LEONUX DESIGN SYSTEM - FILE MANAGER EDITION
         */
        :root {
            --bg-body: #1d101c;
            --surface-base: rgba(42,25,41,0.84);
            --surface-panel: rgba(58,38,57,0.55);
            --surface-hover: rgba(227,213,225,0.08);
            --surface-active: rgba(227,213,225,0.13);
            --surface-selected: rgba(223,118,202,0.15);
            --border-glass: rgba(227,213,225,0.09);
            --border-mid: rgba(227,213,225,0.17);
            
            --text-main: #e3d5e1;
            --text-muted: #b5a0b2;
            
            --accent: #d47abc;
            --accent-glow: rgba(212,122,188,0.35);
            --danger: #ff8a94;
            --success: #7bc74d;
            --warning: #f2b04a;
            --purple: #eaa4dc;
            --folder-color: #df76ca;
            
            --shadow-win: 0 40px 100px -20px rgba(10,3,9,0.95);
            --glass-blur: blur(40px) saturate(180%);
            --radius-xl: clamp(16px, 2vh, 24px);
            --radius-l: clamp(8px, 1vh, 12px);
            --radius-pill: 9999px;
            --ease-leonux: cubic-bezier(0.2, 1, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none; /* Prevent text selection while interacting with files */
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(248,241,247,0.1); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(248,241,247,0.2); }

        .noise-layer {
            position: fixed; inset: 0; opacity: 0.03; pointer-events: none; z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .ambient-glow {
            position: absolute; width: 80vw; height: 80vh; border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(140px); opacity: 0.35; z-index: 1; pointer-events: none; transition: all 1s ease;
        }

        /* App Window */
        .app-frame {
            position: relative; width: 95vw; max-width: 1200px; height: 85vh; max-height: 800px;
            background: var(--surface-base); backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass); border-radius: var(--radius-xl);
            box-shadow: var(--shadow-win); display: flex; flex-direction: column;
            z-index: 10; overflow: hidden; animation: window-open 0.6s var(--ease-leonux) forwards;
        }

        @keyframes window-open {
            from { opacity: 0; transform: scale(0.97) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Header Navigation Toolbar */
        .header-toolbar {
            display: flex; align-items: center; padding: 12px 20px;
            border-bottom: 1px solid var(--border-glass); background: rgba(15,6,13,0.3);
            gap: 16px;
        }

        .window-controls { display: flex; gap: 8px; margin-right: 8px; flex-shrink: 0; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
        .win-close { background: #f75e73; }
        .win-min { background: #e5a648; }
        .win-max { background: #6ca34d; }

        /* Navigation Arrows */
        .nav-arrows { display: flex; gap: 4px; }
        .nav-btn {
            background: transparent; border: 1px solid transparent; color: var(--text-muted);
            width: 32px; height: 32px; border-radius: var(--radius-l); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .nav-btn:hover:not(:disabled) { background: var(--surface-hover); color: var(--text-main); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .nav-btn svg { width: 18px; height: 18px; }

        /* Path Breadcrumbs */
        .breadcrumbs-container {
            flex: 1; display: flex; align-items: center; background: rgba(15,6,13,0.2);
            border: 1px solid var(--border-glass); border-radius: var(--radius-l);
            padding: 4px 12px; overflow-x: auto; scrollbar-width: none; min-height: 36px;
        }
        .breadcrumbs-container::-webkit-scrollbar { display: none; }
        
        .breadcrumb-item {
            display: flex; align-items: center; font-size: 13px; font-weight: 500;
            color: var(--text-muted); cursor: pointer; transition: 0.2s; white-space: nowrap;
        }
        .breadcrumb-item:hover { color: var(--text-main); }
        .breadcrumb-item.active { color: var(--text-main); font-weight: 600; }
        .breadcrumb-separator {
            margin: 0 8px; color: rgba(248,241,247,0.2); display: flex; align-items: center;
        }
        .breadcrumb-separator svg { width: 14px; height: 14px; }

        /* Right Actions */
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .search-wrapper { position: relative; }
        .search-input {
            background: rgba(15,6,13,0.2); border: 1px solid var(--border-glass);
            border-radius: var(--radius-l); padding: 8px 12px 8px 32px; color: var(--text-main);
            font-size: 13px; width: 200px; outline: none; transition: 0.2s;
        }
        .search-input:focus { border-color: var(--accent); background: rgba(15,6,13,0.4); width: 240px; }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-muted); pointer-events: none; }

        .view-toggles { display: flex; background: rgba(15,6,13,0.2); border-radius: var(--radius-l); border: 1px solid var(--border-glass); padding: 2px; }
        .action-btn {
            background: transparent; border: none; color: var(--text-muted); width: 32px; height: 30px;
            border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .action-btn:hover, .action-btn.active { background: rgba(248,241,247,0.1); color: var(--text-main); }

        /* Workspace Core Layout */
        .workspace { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* --- Panel A: Places Sidebar --- */
        .sidebar {
            width: 240px; border-right: 1px solid var(--border-glass); display: flex; flex-direction: column;
            background: rgba(15,6,13,0.15); overflow-y: auto; flex-shrink: 0; padding: 16px 12px; gap: 24px;
        }

        .nav-group { display: flex; flex-direction: column; gap: 2px; }
        .nav-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; padding: 0 12px 8px; }
        
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: var(--radius-l);
            cursor: pointer; transition: all 0.2s ease; font-size: 13px; color: var(--text-muted); font-weight: 500;
        }
        .nav-item:hover { background: var(--surface-hover); color: var(--text-main); }
        .nav-item.active { background: rgba(223,118,202,0.15); color: var(--accent); font-weight: 600; }
        .nav-item svg { width: 18px; height: 18px; opacity: 0.8; }
        .nav-item.active svg { opacity: 1; }

        /* --- Panel B: Main File Viewport --- */
        .content-area {
            flex: 1; display: flex; flex-direction: column; background: transparent; position: relative; overflow: hidden;
        }

        /* List View Headers */
        .list-header {
            display: none; grid-template-columns: minmax(200px, 2fr) 1fr 1fr 1fr; gap: 16px;
            padding: 12px 24px; border-bottom: 1px solid var(--border-glass); background: rgba(15,6,13,0.1);
            font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.5px;
        }
        .view-list .list-header { display: grid; }

        /* File Container */
        .file-container {
            flex: 1; overflow-y: auto; padding: 24px; align-content: start;
        }

        /* GRID VIEW */
        .view-grid .file-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 16px;
        }
        
        .view-grid .file-item {
            display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px;
            border-radius: var(--radius-l); border: 1px solid transparent; cursor: pointer; text-align: center;
        }
        .view-grid .file-item:hover { background: var(--surface-hover); }
        .view-grid .file-item.selected { background: var(--surface-selected); border-color: rgba(223,118,202,0.3); }
        
        .view-grid .file-icon-wrap {
            width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; position: relative;
        }
        .view-grid .file-icon { width: 56px; height: 56px; transition: transform 0.2s ease; }
        .view-grid .file-item:hover .file-icon { transform: scale(1.05); }
        
        .view-grid .file-name {
            font-size: 13px; font-weight: 500; color: var(--text-main);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;
        }
        .view-grid .file-meta { display: none; } /* Hidden in grid */

        /* LIST VIEW */
        .view-list .file-container {
            display: flex; flex-direction: column; gap: 4px; padding: 12px;
        }
        
        .view-list .file-item {
            display: grid; grid-template-columns: minmax(200px, 2fr) 1fr 1fr 1fr; gap: 16px; align-items: center;
            padding: 8px 12px; border-radius: var(--radius-l); border: 1px solid transparent; cursor: pointer;
        }
        .view-list .file-item:hover { background: var(--surface-hover); }
        .view-list .file-item.selected { background: var(--surface-selected); border-color: rgba(223,118,202,0.3); }
        
        .view-list .name-col { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .view-list .file-icon-wrap { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .view-list .file-icon { width: 20px; height: 20px; }
        .view-list .file-name { font-size: 13px; font-weight: 500; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .view-list .file-meta { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Specific Icon Colors */
        .color-folder { color: var(--folder-color); fill: rgba(223,118,202,0.2); }
        .color-image { color: var(--purple); fill: rgba(234,164,220,0.2); }
        .color-video { color: var(--danger); fill: rgba(242,130,145,0.2); }
        .color-audio { color: var(--warning); fill: rgba(237,193,128,0.2); }
        .color-doc { color: var(--accent); fill: rgba(223,118,202,0.2); }
        .color-archive { color: var(--success); fill: rgba(146,192,120,0.2); }
        .color-unknown { color: var(--text-muted); fill: rgba(176,155,172,0.2); }

        /* Empty State */
        .empty-state {
            position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; color: var(--text-muted); opacity: 0.7; pointer-events: none;
        }
        .empty-state.active { display: flex; }
        .empty-state svg { width: 64px; height: 64px; color: var(--border-mid); }

        /* --- Panel C: Properties / Information Sidebar --- */
        .properties-pane {
            width: 280px; border-left: 1px solid var(--border-glass); background: rgba(15,6,13,0.25);
            display: flex; flex-direction: column; transition: all 0.3s var(--ease-leonux);
            overflow-y: auto; flex-shrink: 0; transform: translateX(0);
        }
        .properties-pane.hidden {
            width: 0; border-left-width: 0; opacity: 0; transform: translateX(100%); pointer-events: none;
        }

        .prop-header { padding: 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; border-bottom: 1px solid var(--border-glass); }
        .prop-icon-large { width: 80px; height: 80px; }
        .prop-title { font-size: 16px; font-weight: 600; color: var(--text-main); word-break: break-word; }
        .prop-subtitle { font-size: 13px; color: var(--text-muted); }

        .prop-body { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .prop-group { display: flex; flex-direction: column; gap: 6px; }
        .prop-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .prop-value { font-size: 13px; color: var(--text-main); }
        
        .prop-actions { display: flex; gap: 8px; margin-top: 8px; }
        .prop-btn {
            flex: 1; padding: 8px; border-radius: var(--radius-l); border: 1px solid var(--border-glass);
            background: rgba(248,241,247,0.05); color: var(--text-main); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .prop-btn:hover { background: var(--surface-hover); border-color: var(--border-mid); }
        .prop-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg-body); }
        .prop-btn.primary:hover { background: #e387d1; }

        @media (max-width: 768px) {
            .app-frame { height: 100dvh; max-height: none; width: 100dvw; border-radius: 0; border: none; }
            .sidebar { display: none; } /* Hide sidebar on mobile, rely on breadcrumbs */
            .properties-pane { position: absolute; right: 0; top: 0; bottom: 0; z-index: 50; width: 85%; max-width: 320px; border-left: 1px solid var(--border-glass); background: var(--surface-base); }
            .search-input { width: 140px; }
            .search-input:focus { width: 180px; }
        }
    </style>

        <!-- Top Toolbar -->
        <header class="header-toolbar">
            <div class="window-controls">
                <button class="win-btn win-close" id="btn-close-app"></button>
                <button class="win-btn win-min"></button>
                <button class="win-btn win-max"></button>
            </div>

            <div class="nav-arrows">
                <button class="nav-btn" id="btn-back" disabled title="Back"><svg><use href="#icon-arrow-left"></use></svg></button>
                <button class="nav-btn" id="btn-forward" disabled title="Forward"><svg><use href="#icon-arrow-right"></use></svg></button>
            </div>

            <div class="breadcrumbs-container" id="breadcrumbs">
                <!-- Dynamically populated -->
            </div>

            <div class="header-actions">
                <div class="search-wrapper">
                    <svg class="search-icon"><use href="#icon-search"></use></svg>
                    <input type="text" class="search-input" id="search-input" placeholder="Search files...">
                </div>
                
                <div class="view-toggles">
                    <button class="action-btn active" id="btn-grid-view" title="Grid View"><svg width="16" height="16"><use href="#icon-grid"></use></svg></button>
                    <button class="action-btn" id="btn-list-view" title="List View"><svg width="16" height="16"><use href="#icon-list"></use></svg></button>
                </div>

                <button class="action-btn" id="btn-toggle-props" title="File Properties"><svg width="18" height="18"><use href="#icon-info"></use></svg></button>
            </div>
        </header>

        <div class="workspace">
            
            <!-- Panel A: Sidebar Places -->
            <aside class="sidebar">
                <div class="nav-group">
                    <div class="nav-title">Places</div>
                    <div class="nav-item active" data-path="/Home">
                        <svg><use href="#icon-home"></use></svg><span>Home</span>
                    </div>
                    <div class="nav-item" data-path="/Home/Documents">
                        <svg><use href="#icon-doc"></use></svg><span>Documents</span>
                    </div>
                    <div class="nav-item" data-path="/Home/Downloads">
                        <svg><use href="#icon-download"></use></svg><span>Downloads</span>
                    </div>
                    <div class="nav-item" data-path="/Home/Music">
                        <svg><use href="#icon-music"></use></svg><span>Music</span>
                    </div>
                    <div class="nav-item" data-path="/Home/Pictures">
                        <svg><use href="#icon-picture"></use></svg><span>Pictures</span>
                    </div>
                    <div class="nav-item" data-path="/Home/Videos">
                        <svg><use href="#icon-video"></use></svg><span>Videos</span>
                    </div>
                </div>

                <div class="nav-group">
                    <div class="nav-title">Devices</div>
                    <div class="nav-item" data-path="/System">
                        <svg><use href="#icon-drive"></use></svg><span>System Disk</span>
                    </div>
                    <div class="nav-item" data-path="/External">
                        <svg><use href="#icon-drive"></use></svg><span>Backup Drive</span>
                    </div>
                </div>

                <div class="nav-group" style="margin-top: auto;">
                    <div class="nav-item" data-path="/Trash">
                        <svg><use href="#icon-trash"></use></svg><span>Trash</span>
                    </div>
                </div>
            </aside>

            <!-- Panel B: Main Content (File Grid/List) -->
            <section class="content-area view-grid" id="content-area">
                
                <div class="list-header">
                    <div>Name</div>
                    <div>Size</div>
                    <div>Type</div>
                    <div>Modified</div>
                </div>

                <div class="file-container" id="file-container">
                    <!-- Files injected dynamically -->
                </div>

                <div class="empty-state" id="empty-state">
                    <svg><use href="#file-folder"></use></svg>
                    <p>Folder is empty</p>
                </div>
            </section>

            <!-- Panel C: Properties Pane (Right) -->
            <aside class="properties-pane hidden" id="properties-pane">
                <div id="prop-content" style="display: none;">
                    <div class="prop-header">
                        <svg class="prop-icon-large" id="prop-icon"><use href="#file-unknown"></use></svg>
                        <div>
                            <div class="prop-title" id="prop-name">filename.ext</div>
                            <div class="prop-subtitle" id="prop-type">File Type</div>
                        </div>
                    </div>
                    
                    <div class="prop-body">
                        <div class="prop-group">
                            <span class="prop-label">Size</span>
                            <span class="prop-value" id="prop-size">--</span>
                        </div>
                        <div class="prop-group">
                            <span class="prop-label">Modified</span>
                            <span class="prop-value" id="prop-modified">--</span>
                        </div>
                        <div class="prop-group">
                            <span class="prop-label">Location</span>
                            <span class="prop-value" id="prop-location" style="word-break: break-all; font-family: monospace;">--</span>
                        </div>
                        <div class="prop-group">
                            <span class="prop-label">Permissions</span>
                            <span class="prop-value" id="prop-perms">rw-r--r--</span>
                        </div>

                        <div class="prop-actions">
                            <button class="prop-btn primary" id="btn-open-file">Open</button>
                            <button class="prop-btn" style="color: var(--danger); border-color: rgba(242,130,145,0.3);">Delete</button>
                        </div>
                    </div>
                </div>
                
                <div id="prop-empty" style="padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px;">
                    Select an item to view its properties.
                </div>
            </aside>

        </div>
    </main>

    <script>
        (function() {
            "use strict";

            // --- Virtual File System (VFS) Mock Data ---
            // Structure: flat array with 'parent' defining hierarchy
            const vfs = [
                // Home Folders
                { id: 'h1', name: 'Documents', type: 'folder', parent: '/Home', date: '2026-06-25', size: '--' },
                { id: 'h2', name: 'Downloads', type: 'folder', parent: '/Home', date: '2026-06-26', size: '--' },
                { id: 'h3', name: 'Music', type: 'folder', parent: '/Home', date: '2026-06-20', size: '--' },
                { id: 'h4', name: 'Pictures', type: 'folder', parent: '/Home', date: '2026-06-22', size: '--' },
                { id: 'h5', name: 'Videos', type: 'folder', parent: '/Home', date: '2026-06-18', size: '--' },
                { id: 'h6', name: 'Projects', type: 'folder', parent: '/Home', date: '2026-06-26', size: '--' },
                { id: 'f1', name: 'notes.txt', type: 'doc', parent: '/Home', date: '2026-06-26', size: '12 KB' },
                { id: 'f2', name: 'system_log.tar.gz', type: 'archive', parent: '/Home', date: '2026-06-24', size: '4.2 MB' },
                
                // Documents
                { id: 'd1', name: 'Q3_Report.pdf', type: 'doc', parent: '/Home/Documents', date: '2026-06-25', size: '2.4 MB' },
                { id: 'd2', name: 'Budget_2026.xlsx', type: 'doc', parent: '/Home/Documents', date: '2026-06-20', size: '850 KB' },
                { id: 'd3', name: 'Meeting_Notes.md', type: 'doc', parent: '/Home/Documents', date: '2026-06-26', size: '4 KB' },
                { id: 'd4', name: 'Work', type: 'folder', parent: '/Home/Documents', date: '2026-06-10', size: '--' },
                
                // Work (Nested)
                { id: 'w1', name: 'invoice_001.pdf', type: 'doc', parent: '/Home/Documents/Work', date: '2026-06-05', size: '1.1 MB' },
                
                // Downloads
                { id: 'dl1', name: 'ubuntu-26.04.iso', type: 'archive', parent: '/Home/Downloads', date: '2026-06-26', size: '3.4 GB' },
                { id: 'dl2', name: 'leonux_theme_pack.zip', type: 'archive', parent: '/Home/Downloads', date: '2026-06-25', size: '12.5 MB' },
                { id: 'dl3', name: 'setup.sh', type: 'unknown', parent: '/Home/Downloads', date: '2026-06-24', size: '2 KB' },

                // Pictures
                { id: 'p1', name: 'wallpaper_4k.png', type: 'image', parent: '/Home/Pictures', date: '2026-06-21', size: '8.2 MB' },
                { id: 'p2', name: 'profile_pic.jpg', type: 'image', parent: '/Home/Pictures', date: '2026-06-15', size: '1.4 MB' },
                { id: 'p3', name: 'Screenshots', type: 'folder', parent: '/Home/Pictures', date: '2026-06-26', size: '--' },

                // Videos
                { id: 'v1', name: 'tutorial_record.mp4', type: 'video', parent: '/Home/Videos', date: '2026-06-22', size: '450 MB' },
                { id: 'v2', name: 'demo_reel.mkv', type: 'video', parent: '/Home/Videos', date: '2026-06-19', size: '1.2 GB' },

                // Music
                { id: 'm1', name: 'synthwave_mix.mp3', type: 'audio', parent: '/Home/Music', date: '2026-06-20', size: '85 MB' },
                { id: 'm2', name: 'lofi_beats.flac', type: 'audio', parent: '/Home/Music', date: '2026-06-18', size: '320 MB' },

                // Projects
                { id: 'pr1', name: 'Leonux_OS', type: 'folder', parent: '/Home/Projects', date: '2026-06-26', size: '--' },
                { id: 'pr2', name: 'website_src', type: 'folder', parent: '/Home/Projects', date: '2026-06-25', size: '--' },
                { id: 'pr3', name: 'index.html', type: 'unknown', parent: '/Home/Projects/website_src', date: '2026-06-25', size: '12 KB' },
                
                // System Disks (Mocking roots)
                { id: 's1', name: 'bin', type: 'folder', parent: '/System', date: '2026-01-01', size: '--' },
                { id: 's2', name: 'etc', type: 'folder', parent: '/System', date: '2026-01-01', size: '--' },
                { id: 's3', name: 'var', type: 'folder', parent: '/System', date: '2026-01-01', size: '--' },

                // External
                { id: 'e1', name: 'Backups_2025', type: 'folder', parent: '/External', date: '2025-12-31', size: '--' },
            ];

            // --- State ---
            let currentPath = '/Home';
            let history = ['/Home'];
            let historyIdx = 0;
            let selectedFileId = null;
            let currentSearchQuery = '';

            // --- DOM Elements ---
            const container = document.getElementById('file-container');
            const emptyState = document.getElementById('empty-state');
            const breadcrumbsEl = document.getElementById('breadcrumbs');
            
            const btnBack = document.getElementById('btn-back');
            const btnForward = document.getElementById('btn-forward');
            
            const searchInput = document.getElementById('search-input');
            const contentArea = document.getElementById('content-area');
            const btnGridView = document.getElementById('btn-grid-view');
            const btnListView = document.getElementById('btn-list-view');
            
            const sidebarItems = document.querySelectorAll('.sidebar .nav-item');
            const btnToggleProps = document.getElementById('btn-toggle-props');
            const propertiesPane = document.getElementById('properties-pane');
            const propContent = document.getElementById('prop-content');
            const propEmpty = document.getElementById('prop-empty');
            const ambientGlow = document.getElementById('ambient-glow');

            // --- Initialization ---
            renderView();
            updateHistoryButtons();

            // --- Navigation Logic ---
            function navigateTo(path, addToHistory = true) {
                if (currentPath === path && !currentSearchQuery) return; // Prevent redundant nav
                
                currentPath = path;
                currentSearchQuery = '';
                searchInput.value = '';
                selectedFileId = null;
                
                if (addToHistory) {
                    // Truncate forward history
                    history = history.slice(0, historyIdx + 1);
                    history.push(path);
                    historyIdx++;
                }
                
                updateHistoryButtons();
                updateSidebarActive();
                renderView();
                updatePropertiesPane();
            }

            btnBack.addEventListener('click', () => {
                if (historyIdx > 0) {
                    historyIdx--;
                    navigateTo(history[historyIdx], false);
                }
            });

            btnForward.addEventListener('click', () => {
                if (historyIdx < history.length - 1) {
                    historyIdx++;
                    navigateTo(history[historyIdx], false);
                }
            });

            function updateHistoryButtons() {
                btnBack.disabled = historyIdx === 0;
                btnForward.disabled = historyIdx === history.length - 1;
            }

            function updateSidebarActive() {
                sidebarItems.forEach(item => {
                    item.classList.toggle('active', item.dataset.path === currentPath);
                });
            }

            sidebarItems.forEach(item => {
                item.addEventListener('click', () => {
                    navigateTo(item.dataset.path);
                });
            });

            // --- Rendering Logic ---
            function renderBreadcrumbs() {
                breadcrumbsEl.innerHTML = '';
                
                if (currentSearchQuery) {
                    breadcrumbsEl.innerHTML = `<div class="breadcrumb-item active">Search Results for "${currentSearchQuery}"</div>`;
                    return;
                }

                const parts = currentPath.split('/').filter(p => p);
                let buildPath = '';

                parts.forEach((part, index) => {
                    buildPath += '/' + part;
                    const isLast = index === parts.length - 1;
                    
                    const item = document.createElement('div');
                    item.className = `breadcrumb-item ${isLast ? 'active' : ''}`;
                    item.textContent = part;
                    
                    if (!isLast) {
                        // Capture current buildPath in closure
                        const targetPath = buildPath;
                        item.addEventListener('click', () => navigateTo(targetPath));
                    }
                    
                    breadcrumbsEl.appendChild(item);

                    if (!isLast) {
                        const sep = document.createElement('div');
                        sep.className = 'breadcrumb-separator';
                        sep.innerHTML = '<svg><use href="#icon-chevron-right"></use></svg>';
                        breadcrumbsEl.appendChild(sep);
                    }
                });
            }

            function getIconColorClass(type) {
                const map = {
                    'folder': 'color-folder',
                    'image': 'color-image',
                    'video': 'color-video',
                    'audio': 'color-audio',
                    'doc': 'color-doc',
                    'archive': 'color-archive'
                };
                return map[type] || 'color-unknown';
            }

            function renderView() {
                renderBreadcrumbs();
                container.innerHTML = '';
                
                let filesToRender = [];
                
                if (currentSearchQuery) {
                    filesToRender = vfs.filter(f => f.name.toLowerCase().includes(currentSearchQuery.toLowerCase()));
                } else {
                    filesToRender = vfs.filter(f => f.parent === currentPath);
                }

                // Sort: Folders first, then alphabetically
                filesToRender.sort((a, b) => {
                    if (a.type === 'folder' && b.type !== 'folder') return -1;
                    if (a.type !== 'folder' && b.type === 'folder') return 1;
                    return a.name.localeCompare(b.name);
                });

                if (filesToRender.length === 0) {
                    container.style.display = 'none';
                    emptyState.classList.add('active');
                } else {
                    container.style.display = '';
                    emptyState.classList.remove('active');

                    filesToRender.forEach(file => {
                        const item = document.createElement('div');
                        item.className = `file-item ${file.id === selectedFileId ? 'selected' : ''}`;
                        item.dataset.id = file.id;

                        const colorClass = getIconColorClass(file.type);

                        item.innerHTML = `
                            <div class="name-col">
                                <div class="file-icon-wrap">
                                    <svg class="file-icon ${colorClass}"><use href="#file-${file.type === 'folder' ? 'folder' : file.type}"></use></svg>
                                </div>
                                <div class="file-name" title="${file.name}">${file.name}</div>
                            </div>
                            <div class="file-meta">${file.size}</div>
                            <div class="file-meta" style="text-transform: capitalize;">${file.type}</div>
                            <div class="file-meta">${file.date}</div>
                        `;

                        // Single Click -> Select
                        item.addEventListener('click', (e) => {
                            e.stopPropagation();
                            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('selected'));
                            item.classList.add('selected');
                            selectedFileId = file.id;
                            updatePropertiesPane();
                            updateAmbientGlow(file.type);
                        });

                        // Double Click -> Open Folder
                        item.addEventListener('dblclick', (e) => {
                            e.stopPropagation();
                            if (file.type === 'folder') {
                                navigateTo(file.parent === '/' ? `/${file.name}` : `${file.parent}/${file.name}`);
                            } else {
                                // Simulate opening file
                                console.log(`Opening file: ${file.name}`);
                                item.classList.add('selected'); // visual feedback
                                setTimeout(() => item.classList.remove('selected'), 150);
                            }
                        });

                        container.appendChild(item);
                    });
                }
            }

            // Deselect when clicking empty area
            contentArea.addEventListener('click', () => {
                document.querySelectorAll('.file-item').forEach(el => el.classList.remove('selected'));
                selectedFileId = null;
                updatePropertiesPane();
                ambientGlow.style.background = `radial-gradient(circle, var(--accent-glow) 0%, transparent 70%)`;
            });

            // --- View Toggles ---
            btnGridView.addEventListener('click', () => {
                contentArea.classList.remove('view-list');
                contentArea.classList.add('view-grid');
                btnGridView.classList.add('active');
                btnListView.classList.remove('active');
            });

            btnListView.addEventListener('click', () => {
                contentArea.classList.remove('view-grid');
                contentArea.classList.add('view-list');
                btnListView.classList.add('active');
                btnGridView.classList.remove('active');
            });

            // --- Search ---
            searchInput.addEventListener('input', (e) => {
                currentSearchQuery = e.target.value;
                selectedFileId = null;
                updatePropertiesPane();
                renderView();
            });

            // --- Properties Pane ---
            btnToggleProps.addEventListener('click', () => {
                propertiesPane.classList.toggle('hidden');
                btnToggleProps.classList.toggle('active');
            });

            function updatePropertiesPane() {
                if (!selectedFileId) {
                    propContent.style.display = 'none';
                    propEmpty.style.display = 'block';
                    return;
                }

                const file = vfs.find(f => f.id === selectedFileId);
                if (!file) return;

                propContent.style.display = 'flex';
                propEmpty.style.display = 'none';

                document.getElementById('prop-name').textContent = file.name;
                document.getElementById('prop-type').textContent = file.type === 'folder' ? 'Folder' : `${file.type.toUpperCase()} File`;
                document.getElementById('prop-size').textContent = file.size;
                document.getElementById('prop-modified').textContent = file.date;
                document.getElementById('prop-location').textContent = file.parent;

                const iconColorClass = getIconColorClass(file.type);
                document.getElementById('prop-icon').className = `prop-icon-large ${iconColorClass}`;
                document.getElementById('prop-icon').innerHTML = `<use href="#file-${file.type === 'folder' ? 'folder' : file.type}"></use>`;
                
                const btnOpen = document.getElementById('btn-open-file');
                btnOpen.textContent = file.type === 'folder' ? 'Open Folder' : 'Open File';
                btnOpen.onclick = () => {
                    if (file.type === 'folder') {
                        navigateTo(file.parent === '/' ? `/${file.name}` : `${file.parent}/${file.name}`);
                    }
                };
            }

            function updateAmbientGlow(type) {
                const colorMap = {
                    'folder': 'rgba(223,118,202,0.35)', // accent
                    'image': 'rgba(234,164,220,0.35)', // purple
                    'video': 'rgba(242,130,145,0.35)', // danger
                    'audio': 'rgba(237,193,128,0.35)', // warning
                    'doc': 'rgba(223,118,202,0.35)',    // accent
                    'archive': 'rgba(146,192,120,0.35)'// success
                };
                const color = colorMap[type] || 'rgba(176,155,172,0.2)';
                ambientGlow.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;
            }

            // Window close visual
            document.getElementById('btn-close-app').addEventListener('click', () => {
                document.querySelector('.app-frame').style.animation = "window-open 0.4s var(--ease-leonux) reverse forwards";
                setTimeout(() => document.body.innerHTML = "<h2 style='color:var(--text-muted); font-weight:300;'>File Manager Closed.</h2>", 400);
            });

        })();
    </script>
</body>
</html>
