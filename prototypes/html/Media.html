<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leonux OS - Media Player</title>
    
    <style>
        /**
         * LEONUX DESIGN SYSTEM - MEDIA PLAYER EDITION
         */
        :root {
            --bg-body: #161617;
            --surface-base: rgba(30,30,31,0.84);
            --surface-panel: rgba(58,58,60,0.55);
            --surface-hover: rgba(245,245,247,0.08);
            --surface-active: rgba(245,245,247,0.13);
            --border-glass: rgba(245,245,247,0.09);
            --border-mid: rgba(245,245,247,0.17);
            
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            
            --accent: #dc73c2;
            --accent-glow: rgba(220,115,194,0.35);
            --danger: #ff7a85;
            --success: #7fd35a;
            --warning: #ffb85c;
            
            --shadow-win: 0 40px 100px -20px rgba(6,6,6,0.95);
            --glass-blur: blur(40px) saturate(180%);
            --radius-xl: clamp(16px, 2vh, 24px);
            --radius-l: clamp(8px, 1vh, 12px);
            --radius-pill: 9999px;
            --ease-leonux: cubic-bezier(0.2, 1, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .noise-layer {
            position: fixed; inset: 0; opacity: 0.03; pointer-events: none; z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* Ambient Back Glow Panel */
        .ambient-backlight {
            position: absolute;
            width: 70vw;
            height: 70vh;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(120px);
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
            transition: all 1s ease;
        }

        /* App Main Stage */
        .media-frame {
            position: relative;
            width: 95vw;
            max-width: 1200px;
            height: 85vh;
            max-height: 800px;
            background: var(--surface-base);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-win);
            display: flex;
            flex-direction: column;
            z-index: 10;
            overflow: hidden;
            animation: window-open 0.6s var(--ease-leonux) forwards;
        }

        @keyframes window-open {
            from { opacity: 0; transform: scale(0.97) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Window Navigation Bar */
        .header-nav {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-glass);
            background: rgba(10,10,10,0.25);
            justify-content: space-between;
            z-index: 20;
        }

        .window-controls { display: flex; gap: 8px; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
        .win-close { background: #f75e73; }
        .win-min { background: #e5a648; }
        .win-max { background: #6ca34d; }

        .app-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .cinema-mode-status {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background: rgba(220,115,194,0.1);
            padding: 4px 10px;
            border-radius: 4px;
            display: none;
        }

        /* Workspace Core Layout Split */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* --- Panel A: Visual Stage / Player Viewport (Left side) --- */
        .viewport-column {
            flex: 1;
            position: relative;
            background: rgba(10,10,10,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.4s var(--ease-leonux);
        }

        /* Video element view */
        .video-wrapper {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
        }
        .video-wrapper.active { display: flex; }
        #video-element {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Audio dynamic display view (Cover Art Disc + Visualizer) */
        .audio-stage-wrapper {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            gap: 24px;
        }
        .audio-stage-wrapper.active { display: flex; }

        .disc-carousel {
            position: relative;
            width: 180px; height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 8px solid #090909;
            box-shadow: 0 20px 50px rgba(10,10,10,0.6), inset 0 0 20px rgba(245,245,247,0.05);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.5s ease;
        }
        .disc-carousel::after {
            content: ''; position: absolute; width: 45px; height: 45px;
            border-radius: 50%; background: var(--bg-body); border: 12px solid rgba(245,245,247,0.05);
            box-shadow: inset 0 0 8px rgba(10,10,10,0.8);
        }
        .disc-artwork {
            position: absolute; inset: 12px; border-radius: 50%;
            overflow: hidden; background: linear-gradient(45deg, #48113d, #1c1c1c);
            display: flex; align-items: center; justify-content: center;
            opacity: 0.9;
        }
        .disc-vinyl-grooves {
            position: absolute; inset: 0; border-radius: 50%;
            background: repeating-radial-gradient(circle, transparent, transparent 4px, rgba(245,245,247,0.02) 5px, rgba(245,245,247,0.02) 6px);
            pointer-events: none;
        }
        .disc-carousel.playing {
            animation: disc-spin 12s linear infinite;
        }
        @keyframes disc-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Cover Visualizer Overlay inside Audio view */
        .visualizer-container {
            width: 100%; height: 120px;
            position: relative;
            margin-top: auto;
        }
        #visualizer-canvas {
            width: 100%; height: 100%; display: block;
        }

        /* --- Panel B: Media Playlist / Library Explorer (Right side) --- */
        .library-column {
            width: 360px;
            border-left: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            background: rgba(10,10,10,0.15);
            transition: all 0.4s var(--ease-leonux);
            flex-shrink: 0;
        }
        .library-column.collapsed {
            width: 0px;
            border-left-width: 0px;
            opacity: 0;
            pointer-events: none;
        }

        .library-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .upload-row {
            display: flex; gap: 10px; align-items: center;
        }

        .dropzone-trigger {
            flex: 1;
            background: rgba(245,245,247,0.02);
            border: 1.5px dashed var(--border-mid);
            border-radius: var(--radius-l);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 13px; font-weight: 500; color: var(--text-muted);
        }
        .dropzone-trigger:hover, .dropzone-trigger.dragover {
            border-color: var(--accent);
            background: rgba(220,115,194,0.05);
            color: var(--text-main);
        }

        #file-loader { display: none; }

        /* Media Items Grid List */
        .playlist-deck {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .media-card {
            padding: 12px 14px;
            border-radius: var(--radius-l);
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s var(--ease-leonux);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .media-card:hover {
            background: var(--surface-hover);
        }
        .media-card.active {
            background: rgba(245,245,247,0.04);
            border-color: var(--border-glass);
        }

        .media-thumbnail {
            width: 40px; height: 40px;
            border-radius: 6px;
            background: rgba(245,245,247,0.03);
            border: 1px solid var(--border-glass);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .media-card.active .media-thumbnail {
            color: var(--accent);
            border-color: var(--accent-glow);
            background: rgba(220,115,194,0.08);
        }

        .media-meta {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; gap: 4px;
        }
        .media-title {
            font-size: 13px; font-weight: 600; color: var(--text-main);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .media-artist {
            font-size: 11px; color: var(--text-muted);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .media-badge {
            font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
            text-transform: uppercase; letter-spacing: 0.5px;
            background: rgba(245,245,247,0.06); color: var(--text-muted);
        }
        .media-badge.video {
            background: rgba(220,115,194,0.15); color: var(--accent);
        }

        /* --- Panel C: Cinema & Layout Controls overlays --- */
        .cinema-shade-panel {
            position: absolute; inset: 0; background: rgba(10,10,10,0.85);
            z-index: 5; opacity: 0; pointer-events: none;
            transition: all 0.4s ease;
        }
        .cinema-shade-panel.active { opacity: 1; pointer-events: auto; }

        /* --- Dashboard Controller Console Bar (Bottom Overlay) --- */
        .controls-console {
            background: rgba(11,11,11,0.95);
            border-top: 1px solid var(--border-glass);
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 15;
            transition: all 0.4s var(--ease-leonux);
        }

        /* Seek Tracker slider wrapper */
        .scrubber-axis {
            display: flex; align-items: center; gap: 14px;
        }
        .scub-time {
            font-size: 11px; font-family: monospace; color: var(--text-muted); width: 42px;
        }
        .scub-time.time-total { text-align: right; }

        /* Custom Audio/Video track progress bars */
        .timeline-track-container {
            flex: 1; height: 16px; display: flex; align-items: center; cursor: pointer; position: relative;
        }
        .timeline-track-rail {
            width: 100%; height: 4px; background: rgba(245,245,247,0.1); border-radius: 2px; position: relative; overflow: hidden;
        }
        .timeline-fill {
            width: 0%; height: 100%; background: var(--accent); border-radius: 2px;
            box-shadow: 0 0 10px var(--accent-glow); transition: width 0.1s linear;
        }
        .timeline-pin {
            position: absolute; width: 12px; height: 12px; border-radius: 50%;
            background: #f5f5f7; border: 2.5px solid var(--accent); left: 0%; transform: translateX(-50%);
            box-shadow: 0 0 8px rgba(10,10,10,0.5); opacity: 0; transition: opacity 0.2s ease, left 0.1s linear; pointer-events: none;
        }
        .timeline-track-container:hover .timeline-pin { opacity: 1; }
        .timeline-track-container:hover .timeline-track-rail { height: 6px; }

        /* Master Commands layout line */
        .controls-action-line {
            display: flex; justify-content: space-between; align-items: center;
        }

        .console-column { display: flex; align-items: center; gap: 16px; }
        .console-column.left-meta { width: 25%; }
        .console-column.center-controls { width: 50%; justify-content: center; gap: 20px; }
        .console-column.right-tools { width: 25%; justify-content: flex-end; }

        /* Dashboard controls meta tags */
        .console-track-title { font-size: 14px; font-weight: 600; color: var(--text-main); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .console-track-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* Interactive controls buttons catalog */
        .ctrl-tool {
            background: transparent; border: none; color: var(--text-muted);
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; cursor: pointer; transition: all 0.2s ease;
        }
        .ctrl-tool:hover:not(:disabled) { color: var(--text-main); background: var(--surface-hover); }
        .ctrl-tool:active:not(:disabled) { transform: scale(0.9); }
        .ctrl-tool.active-setting { color: var(--accent); }
        
        .ctrl-tool.btn-master-play {
            background: var(--text-main); color: var(--bg-body); width: 44px; height: 44px;
            box-shadow: 0 4px 15px rgba(245,245,247,0.15);
        }
        .ctrl-tool.btn-master-play:hover {
            background: #f5f5f7; color: var(--bg-body); transform: scale(1.05);
        }

        /* Volume controls sliders overlay */
        .volume-tool-box { display: flex; align-items: center; gap: 10px; width: 120px; }
        .volume-slide-rail { flex: 1; height: 16px; display: flex; align-items: center; cursor: pointer; position: relative; }
        .volume-rail-back { width: 100%; height: 4px; background: rgba(245,245,247,0.1); border-radius: 2px; }
        .volume-rail-fill { width: 80%; height: 100%; background: var(--text-muted); border-radius: 2px; }
        .volume-tool-box:hover .volume-rail-fill { background: var(--accent); }

        /* Selectable parameter configurations */
        .badge-select {
            background: rgba(245,245,247,0.04); border: 1px solid var(--border-glass);
            border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 600;
            color: var(--text-muted); cursor: pointer; outline: none; transition: 0.2s;
        }
        .badge-select:hover { color: var(--text-main); border-color: var(--border-mid); }

        @media (max-width: 768px) {
            .media-frame { height: 100dvh; max-height: none; width: 100dvw; border-radius: 0; border: none; }
            .workspace { flex-direction: column; }
            .library-column { width: 100%; height: 40%; border-left: none; border-top: 1px solid var(--border-glass); }
            .viewport-column { height: 60%; }
            .console-column.left-meta { display: none; }
            .console-column.center-controls { width: 70%; }
            .console-column.right-tools { width: 30%; }
        }
    </style>

    <main class="media-frame">
        <header class="header-nav">
            <div class="window-controls">
                <button class="win-btn win-close" id="btn-kill-app" title="Terminate Player"></button>
                <button class="win-btn win-min"></button>
                <button class="win-btn win-max"></button>
            </div>
            <div class="app-title" id="pms-title-header">Leonux Media Center</div>
            <div class="cinema-mode-status" id="cinema-status">Cinema Mode Active</div>
            <div style="width: 52px;"></div> <!-- visual layout balance -->
        </header>

        <div class="workspace">
            
            <!-- PANEL A: VIEWPORT / STREAM STAGE -->
            <section class="viewport-column" id="viewport-stage">
                
                <!-- Video Display Frame -->
                <div class="video-wrapper" id="display-video">
                    <video id="video-element" preload="auto" playsinline crossorigin="anonymous"></video>
                </div>

                <!-- Audio Display Frame -->
                <div class="audio-stage-wrapper" id="display-audio">
                    <div class="disc-carousel" id="spinning-disc">
                        <div class="disc-artwork">
                            <svg width="60" height="60" style="opacity: 0.15; color:#f5f5f7;"><use href="#icon-audio"></use></svg>
                        </div>
                        <div class="disc-vinyl-grooves"></div>
                    </div>
                    
                    <div class="visualizer-container">
                        <canvas id="visualizer-canvas"></canvas>
                    </div>
                </div>

            </section>

            <!-- PANEL B: PLAYLIST SHELF LIBRARY -->
            <aside class="library-column" id="library-shelf">
                <div class="library-header">
                    <div class="upload-row">
                        <div class="dropzone-trigger" id="drop-area" title="Drag audio/video or click to browse">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m-8-8h16" stroke-linecap="round"/></svg>
                            <span>Import Local Media</span>
                        </div>
                        <input type="file" id="file-loader" multiple accept="audio/*,video/*">
                    </div>
                    
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">Playlist Index</span>
                        <span style="font-size:11px; color:var(--accent); font-family:monospace;" id="playlist-count">0 items</span>
                    </div>
                </div>

                <div class="playlist-deck" id="playlist-deck">
                    <!-- Populated dynamically -->
                </div>
            </aside>

        </div>

        <!-- PANEL C: DASHBOARD CONTROLLER CONSOLE (Bottom Console Bar) -->
        <footer class="controls-console" id="controls-console">
            
            <!-- Seek timelines tracker line -->
            <div class="scrubber-axis">
                <span class="scub-time" id="scub-elapsed">00:00</span>
                <div class="timeline-track-container" id="timeline-seek">
                    <div class="timeline-track-rail">
                        <div class="timeline-fill" id="timeline-fill"></div>
                    </div>
                    <div class="timeline-pin" id="timeline-pin"></div>
                </div>
                <span class="scub-time time-total" id="scub-total">00:00</span>
            </div>

            <!-- Interaction triggers row -->
            <div class="controls-action-line">
                
                <!-- Columns 1: Metadata readout -->
                <div class="console-column left-meta">
                    <div style="display:flex; flex-direction:column;">
                        <span class="console-track-title" id="console-title">Select media track</span>
                        <span class="console-track-desc" id="console-desc">Leonux Media Library v2.0</span>
                    </div>
                </div>

                <!-- Columns 2: Master Core Playback operations -->
                <div class="console-column center-controls">
                    <button class="ctrl-tool" id="btn-shuffle" title="Shuffle Mode"><svg width="16" height="16"><use href="#icon-shuffle"></use></svg></button>
                    <button class="ctrl-tool" id="btn-prev" title="Previous Track"><svg width="20" height="20"><use href="#icon-prev"></use></svg></button>
                    <button class="ctrl-tool btn-master-play" id="btn-play" title="Play / Pause"><svg width="22" height="22" id="play-symbol"><use href="#icon-play"></use></svg></button>
                    <button class="ctrl-tool" id="btn-next" title="Next Track"><svg width="20" height="20"><use href="#icon-next"></use></svg></button>
                    <button class="ctrl-tool" id="btn-repeat" title="Repeat Mode"><svg width="16" height="16"><use href="#icon-repeat"></use></svg></button>
                </div>

                <!-- Columns 3: Global System Utilities overlays -->
                <div class="console-column right-tools">
                    <select class="badge-select" id="play-speed" title="Playback Speed">
                        <option value="0.5">0.5x</option>
                        <option value="1" selected>1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2.0x</option>
                    </select>

                    <div class="volume-tool-box">
                        <button class="ctrl-tool" id="btn-mute" title="Volume On/Off" style="width:30px; height:30px;"><svg width="16" height="16" id="mute-symbol"><use href="#icon-volume-on"></use></svg></button>
                        <div class="volume-slide-rail" id="vol-slider">
                            <div class="volume-rail-back">
                                <div class="volume-rail-fill" id="vol-fill" style="width: 80%;"></div>
                            </div>
                        </div>
                    </div>

                    <button class="ctrl-tool" id="btn-pip" title="Picture in Picture Mode" style="display:none;"><svg width="18" height="18"><use href="#icon-pip"></use></svg></button>
                    <button class="ctrl-tool" id="btn-cinema" title="Cinema View Mode"><svg width="18" height="18"><use href="#icon-cinema"></use></svg></button>
                    <button class="ctrl-tool" id="btn-fullscreen" title="Fullscreen"><svg width="18" height="18"><use href="#icon-fullscreen"></use></svg></button>
                </div>

            </div>

        </footer>
    </main>

    <!-- Hidden audio element used specifically for standard audio-only streams -->
    <audio id="audio-element" crossorigin="anonymous"></audio>

    <script>
        (function() {
            "use strict";

            // --- Real Royalty-Free Demo Tracks Database ---
            const initialDemoTracks = [
                {
                    id: "demo-track-1",
                    title: "Chill Lofi Beats",
                    artist: "SoundHelix Core",
                    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                    type: "audio",
                    accentColor: "rgba(220,115,194,0.4)" // Blue ambient
                },
                {
                    id: "demo-track-2",
                    title: "Synthwave Voyager Voyage",
                    artist: "SoundHelix Core",
                    url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                    type: "audio",
                    accentColor: "rgba(240,147,215,0.4)" // Purple ambient
                },
                {
                    id: "demo-track-3",
                    title: "Ocean Sunset Video",
                    artist: "Mixkit Studio Stream",
                    url: "https://assets.mixkit.co/videos/preview/mixkit-sunset-middle-of-the-ocean-43026-large.mp4",
                    type: "video",
                    accentColor: "rgba(237,193,128,0.4)" // Gold ambient
                },
                {
                    id: "demo-track-4",
                    title: "Golden Sunlit Stream",
                    artist: "Mixkit Studio Stream",
                    url: "https://assets.mixkit.co/videos/preview/mixkit-forest-stream-in-the-sunlight-529-large.mp4",
                    type: "video",
                    accentColor: "rgba(146,192,120,0.4)" // Green ambient
                }
            ];

            // --- Player Master Configurations State ---
            let mediaPlaylist = [...initialDemoTracks];
            let activeTrackIndex = 0;
            let currentMediaElement = null; // Dynamically tracks active audio or video element
            let shuffleActive = false;
            let repeatActive = 'off'; // 'off', 'one', 'all'
            let isCinemaMode = false;
            let isMuted = false;
            let lastVolFraction = 0.8;

            // --- Analytical Web Audio Visualizer API State ---
            let audioContextInstance = null;
            let analyzerNodeInstance = null;
            let audioSourceNode = null;
            let canvasAnimationId = null;

            // --- DOM Elements References ---
            const audioEngine = document.getElementById('audio-element');
            const videoEngine = document.getElementById('video-element');
            const displayVideoPanel = document.getElementById('display-video');
            const displayAudioPanel = document.getElementById('display-audio');
            
            const dropArea = document.getElementById('drop-area');
            const fileLoaderInput = document.getElementById('file-loader');
            const playlistDeck = document.getElementById('playlist-deck');
            const playlistCountText = document.getElementById('playlist-count');

            // Bottom controls overlay references
            const elapsedTimer = document.getElementById('scub-elapsed');
            const totalTimer = document.getElementById('scub-total');
            const timelineSeekWrapper = document.getElementById('timeline-seek');
            const timelineFillProgress = document.getElementById('timeline-fill');
            const timelineSliderPin = document.getElementById('timeline-pin');

            const consoleTitle = document.getElementById('console-title');
            const consoleDesc = document.getElementById('console-desc');

            const btnPlay = document.getElementById('btn-play');
            const playSymbol = document.getElementById('play-symbol');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const btnShuffle = document.getElementById('btn-shuffle');
            const btnRepeat = document.getElementById('btn-repeat');
            const btnMute = document.getElementById('btn-mute');
            const muteSymbol = document.getElementById('mute-symbol');
            const volSliderRail = document.getElementById('vol-slider');
            const volSliderFill = document.getElementById('vol-fill');

            const playSpeedSelect = document.getElementById('play-speed');
            const btnPip = document.getElementById('btn-pip');
            const btnCinema = document.getElementById('btn-cinema');
            const btnFullscreen = document.getElementById('btn-fullscreen');
            
            const ambientBacklight = document.getElementById('ambient-backlight');
            const libraryShelf = document.getElementById('library-shelf');
            const cinemaStatusText = document.getElementById('cinema-status');
            const discCarousel = document.getElementById('spinning-disc');

            // Picture-in-picture visibility check
            if (document.pictureInPictureEnabled) {
                btnPip.style.display = 'block';
            }

            // --- Drag & Drop Imports Manager ---
            ['dragenter', 'dragover'].forEach(name => {
                dropArea.addEventListener(name, (e) => {
                    e.preventDefault();
                    dropArea.classList.add('dragover');
                });
            });

            ['dragleave', 'drop'].forEach(name => {
                dropArea.addEventListener(name, (e) => {
                    e.preventDefault();
                    dropArea.classList.remove('dragover');
                });
            });

            dropArea.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                if (dt.files.length) handleImportedMediaFiles(dt.files);
            });

            dropArea.addEventListener('click', () => {
                fileLoaderInput.click();
            });

            fileLoaderInput.addEventListener('change', (e) => {
                if (e.target.files.length) handleImportedMediaFiles(e.target.files);
            });

            function handleImportedMediaFiles(files) {
                Array.from(files).forEach(file => {
                    const isVideo = file.type.startsWith('video/');
                    const isAudio = file.type.startsWith('audio/');
                    
                    if (!isVideo && !isAudio) return;

                    const objectURL = URL.createObjectURL(file);
                    const newTrackItem = {
                        id: 'imported-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                        title: file.name.substring(0, file.name.lastIndexOf('.')) || file.name,
                        artist: "Local Storage Library",
                        url: objectURL,
                        type: isVideo ? 'video' : 'audio',
                        accentColor: isVideo ? "rgba(242,130,145,0.4)" : "rgba(220,115,194,0.4)"
                    };

                    mediaPlaylist.push(newTrackItem);
                });

                rebuildPlaylistDOM();
                
                // Immediately switch playhead to the first newly imported track
                if (mediaPlaylist.length > initialDemoTracks.length) {
                    activeTrackIndex = mediaPlaylist.length - files.length;
                    activateSelectedTrack();
                }
            }

            // --- Render Dynamic Playlist DOM Index ---
            function rebuildPlaylistDOM() {
                playlistDeck.innerHTML = '';
                playlistCountText.textContent = `${mediaPlaylist.length} items`;

                mediaPlaylist.forEach((track, index) => {
                    const card = document.createElement('div');
                    card.className = `media-card ${index === activeTrackIndex ? 'active' : ''}`;
                    
                    const cardIconSymbol = track.type === 'video' ? '#icon-video' : '#icon-audio';
                    const formatBadgeText = track.type === 'video' ? 'video' : 'audio';

                    card.innerHTML = `
                        <div class="media-thumbnail">
                            <svg width="18" height="18"><use href="${cardIconSymbol}"></use></svg>
                        </div>
                        <div class="media-meta">
                            <span class="media-title">${track.title}</span>
                            <span class="media-artist">${track.artist}</span>
                        </div>
                        <span class="media-badge ${track.type}">${formatBadgeText}</span>
                    `;

                    card.addEventListener('click', () => {
                        activeTrackIndex = index;
                        rebuildPlaylistDOM();
                        activateSelectedTrack();
                    });

                    playlistDeck.appendChild(card);
                });
            }

            // --- Media Switching Core Engine Logic ---
            function activateSelectedTrack() {
                // Pause whichever engines are currently rendering
                audioEngine.pause();
                videoEngine.pause();

                const track = mediaPlaylist[activeTrackIndex];

                // Synchronize correct active source references
                if (track.type === 'video') {
                    currentMediaElement = videoEngine;
                    displayAudioPanel.classList.remove('active');
                    displayVideoPanel.classList.add('active');
                } else {
                    currentMediaElement = audioEngine;
                    displayVideoPanel.classList.remove('active');
                    displayAudioPanel.classList.add('active');
                }

                // Update text meta tags inside control panel
                consoleTitle.textContent = track.title;
                consoleDesc.textContent = track.artist;
                
                // Project Ambient backlight color scheme
                ambientBacklight.style.background = `radial-gradient(circle, ${track.accentColor} 0%, transparent 70%)`;

                // Set stream parameters and run execution loop
                currentMediaElement.src = track.url;
                currentMediaElement.playbackRate = parseFloat(playSpeedSelect.value);
                setEngineVolume(isMuted ? 0 : lastVolFraction);

                // Run boot triggers (User gestural context required for WebAudio check)
                const playPromise = currentMediaElement.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        updatePlayIndicatorUI(true);
                        initializeWebAudioVisualizer();
                    }).catch(error => {
                        // User interaction requirement fallback
                        updatePlayIndicatorUI(false);
                        console.log("Leonux playback paused pending user structural interaction context.");
                    });
                }

                // Apply active design markers to card lists
                document.querySelectorAll('.media-card').forEach((card, idx) => {
                    card.classList.toggle('active', idx === activeTrackIndex);
                });

                // Set timeline bounds
                resetTimelineTrackers();
            }

            // --- Timeline Tracking & Formatters ---
            function formatTimeString(secs) {
                if (isNaN(secs)) return '00:00';
                const minutes = Math.floor(secs / 60);
                const seconds = Math.floor(secs % 60);
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            function resetTimelineTrackers() {
                elapsedTimer.textContent = "00:00";
                totalTimer.textContent = "00:00";
                timelineFillProgress.style.width = "0%";
                timelineSliderPin.style.left = "0%";
            }

            // Bind playback trackers to frame rendering routines
            function updateMediaTimeEvents() {
                if (!currentMediaElement) return;
                
                const cur = currentMediaElement.currentTime;
                const dur = currentMediaElement.duration;

                if (!isNaN(dur)) {
                    elapsedTimer.textContent = formatTimeString(cur);
                    totalTimer.textContent = formatTimeString(dur);
                    const percentage = (cur / dur) * 100;
                    timelineFillProgress.style.width = `${percentage}%`;
                    timelineSliderPin.style.left = `${percentage}%`;
                }
            }

            audioEngine.addEventListener('timeupdate', updateMediaTimeEvents);
            videoEngine.addEventListener('timeupdate', updateMediaTimeEvents);

            // Seek track selection handlers
            timelineSeekWrapper.addEventListener('click', (e) => {
                if (!currentMediaElement) return;
                const rect = timelineSeekWrapper.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const percent = Math.min(1, Math.max(0, clickX / rect.width));
                
                const dur = currentMediaElement.duration;
                if (!isNaN(dur)) {
                    currentMediaElement.currentTime = percent * dur;
                    updateMediaTimeEvents();
                }
            });

            // Master Play / Pause logic switch
            function toggleMasterPlayState() {
                if (!currentMediaElement) return;

                if (currentMediaElement.paused) {
                    currentMediaElement.play().then(() => {
                        updatePlayIndicatorUI(true);
                        initializeWebAudioVisualizer();
                    });
                } else {
                    currentMediaElement.pause();
                    updatePlayIndicatorUI(false);
                }
            }

            function updatePlayIndicatorUI(isPlaying) {
                if (isPlaying) {
                    playSymbol.innerHTML = `<use href="#icon-pause"></use>`;
                    discCarousel.classList.add('playing');
                } else {
                    playSymbol.innerHTML = `<use href="#icon-play"></use>`;
                    discCarousel.classList.remove('playing');
                }
            }

            btnPlay.addEventListener('click', toggleMasterPlayState);

            // --- Prev / Next Sequence Handlers ---
            function executeSkipToNextTrack() {
                if (shuffleActive) {
                    activeTrackIndex = Math.floor(Math.random() * mediaPlaylist.length);
                } else {
                    activeTrackIndex = (activeTrackIndex + 1) % mediaPlaylist.length;
                }
                activateSelectedTrack();
            }

            function executeSkipToPreviousTrack() {
                activeTrackIndex = (activeTrackIndex - 1 + mediaPlaylist.length) % mediaPlaylist.length;
                activateSelectedTrack();
            }

            btnNext.addEventListener('click', executeSkipToNextTrack);
            btnPrev.addEventListener('click', executeSkipToPreviousTrack);

            // Auto-advance media tracking hooks
            audioEngine.addEventListener('ended', handleEndedCycle);
            videoEngine.addEventListener('ended', handleEndedCycle);

            function handleEndedCycle() {
                if (repeatActive === 'one') {
                    currentMediaElement.currentTime = 0;
                    currentMediaElement.play();
                } else if (repeatActive === 'all') {
                    executeSkipToNextTrack();
                } else {
                    // repeat off: play next track until last, then pause
                    if (activeTrackIndex < mediaPlaylist.length - 1) {
                        executeSkipToNextTrack();
                    } else {
                        updatePlayIndicatorUI(false);
                    }
                }
            }

            // Shuffle Toggle
            btnShuffle.addEventListener('click', () => {
                shuffleActive = !shuffleActive;
                btnShuffle.classList.toggle('active-setting', shuffleActive);
            });

            // Repeat toggle sequence
            btnRepeat.addEventListener('click', () => {
                if (repeatActive === 'off') {
                    repeatActive = 'all';
                    btnRepeat.classList.add('active-setting');
                    btnRepeat.setAttribute('title', 'Repeat All On');
                    btnRepeat.style.opacity = '1';
                } else if (repeatActive === 'all') {
                    repeatActive = 'one';
                    btnRepeat.classList.add('active-setting');
                    btnRepeat.setAttribute('title', 'Repeat Track On');
                    btnRepeat.style.border = '1px solid var(--accent)';
                } else {
                    repeatActive = 'off';
                    btnRepeat.classList.remove('active-setting');
                    btnRepeat.setAttribute('title', 'Repeat Off');
                    btnRepeat.style.border = 'none';
                    btnRepeat.style.opacity = '0.5';
                }
            });

            // Playback speed select change hook
            playSpeedSelect.addEventListener('change', (e) => {
                if (currentMediaElement) {
                    currentMediaElement.playbackRate = parseFloat(e.target.value);
                }
            });

            // --- Sound Engine & Volume Trackers ---
            function setEngineVolume(volFraction) {
                audioEngine.volume = volFraction;
                videoEngine.volume = volFraction;
                volSliderFill.style.width = `${volFraction * 100}%`;
                
                if (volFraction === 0) {
                    muteSymbol.innerHTML = `<use href="#icon-volume-off"></use>`;
                    btnMute.classList.add('active-setting');
                } else {
                    muteSymbol.innerHTML = `<use href="#icon-volume-on"></use>`;
                    btnMute.classList.remove('active-setting');
                }
            }

            volSliderRail.addEventListener('click', (e) => {
                const rect = volSliderRail.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const percentage = Math.min(1, Math.max(0, clickX / rect.width));
                lastVolFraction = percentage;
                isMuted = false;
                setEngineVolume(percentage);
            });

            btnMute.addEventListener('click', () => {
                isMuted = !isMuted;
                if (isMuted) {
                    setEngineVolume(0);
                } else {
                    setEngineVolume(lastVolFraction);
                }
            });

            // --- Layout & Cinematic Control Screen Toggles ---
            btnCinema.addEventListener('click', () => {
                isCinemaMode = !isCinemaMode;
                libraryShelf.classList.toggle('collapsed', isCinemaMode);
                btnCinema.classList.toggle('active-setting', isCinemaMode);
                cinemaStatusText.style.display = isCinemaMode ? 'block' : 'none';
                
                // Adjust drawing dimensions for canvases after layout shifts
                setTimeout(() => {
                    resizeVisualizerCanvas();
                }, 410);
            });

            btnFullscreen.addEventListener('click', () => {
                const stage = document.getElementById('viewport-stage');
                if (!document.fullscreenElement) {
                    stage.requestFullscreen().catch(err => {
                        console.log(`Unable to engage fullscreen: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            });

            btnPip.addEventListener('click', async () => {
                try {
                    if (document.pictureInPictureElement) {
                        await document.exitPictureInPicture();
                    } else if (currentMediaElement === videoEngine) {
                        await videoEngine.requestPictureInPicture();
                    }
                } catch (e) {
                    console.log("Picture-In-Picture operation denied/unsupported.");
                }
            });

            // Close app event trigger
            document.getElementById('btn-kill-app').addEventListener('click', () => {
                document.querySelector('.media-frame').style.animation = "window-open 0.4s var(--ease-leonux) reverse forwards";
                audioEngine.pause();
                videoEngine.pause();
                if (canvasAnimationId) cancelAnimationFrame(canvasAnimationId);
                setTimeout(() => document.body.innerHTML = "<h2 style='color:var(--text-muted); font-weight:300;'>Leonux Media Service Paused.</h2>", 400);
            });

            // --- Analytical Canvas Audio Visualizer Engine (CORS Proofed) ---
            const canvas = document.getElementById('visualizer-canvas');
            const canvasCtx = canvas.getContext('2d');
            let isUsingMockGenerator = true; // True by default until AudioContext can verify CORS clearance

            function resizeVisualizerCanvas() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = canvas.clientWidth * dpr;
                canvas.height = canvas.clientHeight * dpr;
                canvasCtx.scale(dpr, dpr);
            }
            window.addEventListener('resize', resizeVisualizerCanvas);

            function initializeWebAudioVisualizer() {
                if (audioContextInstance) return; // Already linked to nodes

                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioContextInstance = new AudioContextClass();
                    analyzerNodeInstance = audioContextInstance.createAnalyser();
                    analyzerNodeInstance.fftSize = 256;

                    // Dual route inputs from both hidden audio tags and video stages
                    const audioSource = audioContextInstance.createMediaElementSource(audioEngine);
                    const videoSource = audioContextInstance.createMediaElementSource(videoEngine);

                    audioSource.connect(analyzerNodeInstance);
                    videoSource.connect(analyzerNodeInstance);

                    analyzerNodeInstance.connect(audioContextInstance.destination);
                    
                    isUsingMockGenerator = false;
                } catch (e) {
                    console.log("Cross-Origin restrictions detected. Initiating beautiful mock procedural wave rendering.");
                    isUsingMockGenerator = true;
                }

                resizeVisualizerCanvas();
                runActiveVisualizerLoop();
            }

            let phaseShiftVal = 0; // Floating modifier to animate procedurally simulated waves
            
            function runActiveVisualizerLoop() {
                canvasAnimationId = requestAnimationFrame(runActiveVisualizerLoop);

                const width = canvas.width / (window.devicePixelRatio || 1);
                const height = canvas.height / (window.devicePixelRatio || 1);
                canvasCtx.clearRect(0, 0, width, height);

                const currentTrack = mediaPlaylist[activeTrackIndex];
                const themeStrokeColor = currentTrack ? currentTrack.accentColor.replace('0.4', '1') : 'rgba(220,115,194,1)';
                const isPlaying = currentMediaElement && !currentMediaElement.paused;

                if (!isUsingMockGenerator && analyzerNodeInstance && isPlaying) {
                    // Standard Web Audio FFT rendering
                    const bufferLength = analyzerNodeInstance.frequencyBinCount;
                    const dataArray = new Uint8Array(bufferLength);
                    analyzerNodeInstance.getByteFrequencyData(dataArray);

                    const barWidth = (width / bufferLength) * 1.5;
                    let barHeight;
                    let x = 0;

                    for (let i = 0; i < bufferLength; i++) {
                        barHeight = (dataArray[i] / 255) * height * 0.8;

                        const gradient = canvasCtx.createLinearGradient(0, height, 0, height - barHeight);
                        gradient.addColorStop(0, 'transparent');
                        gradient.addColorStop(0.5, themeStrokeColor);
                        gradient.addColorStop(1, '#f5f5f7');

                        canvasCtx.fillStyle = gradient;
                        canvasCtx.fillRect(x, height - barHeight, barWidth - 2, barHeight);

                        x += barWidth;
                    }
                } else {
                    // CORS Proof / Offline procedural wave generator
                    phaseShiftVal += isPlaying ? 0.08 : 0.01;

                    canvasCtx.beginPath();
                    canvasCtx.lineWidth = 2.5;
                    canvasCtx.strokeStyle = themeStrokeColor;

                    const wavesAmount = isPlaying ? 3 : 1;
                    
                    for (let w = 0; w < wavesAmount; w++) {
                        canvasCtx.beginPath();
                        canvasCtx.strokeStyle = w === 0 ? themeStrokeColor : `${themeStrokeColor}33`;
                        canvasCtx.lineWidth = w === 0 ? 2 : 1;

                        for (let x = 0; x < width; x++) {
                            const frequency = 0.01 + (w * 0.002);
                            const amplitude = isPlaying ? (height * 0.3) / (w + 1) : 4;
                            
                            // Generate complex multi-octave math sine wave
                            const y = height / 2 + Math.sin(x * frequency + phaseShiftVal + w) * amplitude * Math.cos(x * 0.002);
                            
                            if (x === 0) canvasCtx.moveTo(x, y);
                            else canvasCtx.lineTo(x, y);
                        }
                        canvasCtx.stroke();
                    }
                }
            }

            // --- Initial Boots ---
            rebuildPlaylistDOM();
            activateSelectedTrack();
            resizeVisualizerCanvas();
            runActiveVisualizerLoop();

        })();
    </script>
