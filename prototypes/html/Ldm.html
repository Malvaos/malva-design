<!DOCTYPE html>
<html lang="en" data-theme="cyber">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LDM — Leonux Display Manager</title>

    <style>
        /**
         * LEONUX DESIGN SYSTEM - LDM DISPLAY MANAGER EDITION
         */
        :root {
            --bg-body: #1d101c;
            --surface-base: rgba(42,25,41,0.84);
            --surface-panel: rgba(58,38,57,0.55);
            --surface-hover: rgba(227,213,225,0.08);
            --surface-active: rgba(227,213,225,0.13);
            --border-glass: rgba(227,213,225,0.09);
            --border-mid: rgba(227,213,225,0.17);
            
            --text-main: #e3d5e1;
            --text-muted: #b5a0b2;
            
            --accent: #d47abc;
            --accent-glow: rgba(212,122,188,0.35);
            --danger: #ff8a94;
            --success: #7bc74d;
            --warning: #f2b04a;
            
            --shadow-win: 0 40px 100px -20px rgba(10,3,9,0.95);
            --glass-blur: blur(40px) saturate(180%);
            --radius-xl: clamp(16px, 2vh, 24px);
            --radius-l: clamp(8px, 1vh, 12px);
            --radius-pill: 9999px;
            --ease-leonux: cubic-bezier(0.2, 1, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        .noise-layer {
            position: fixed; inset: 0; opacity: 0.03; pointer-events: none; z-index: 2;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* Abstract Fluid Background Blobs */
        .ambient-blobs {
            position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.35;
            animation: float 25s infinite alternate ease-in-out;
        }
        .blob-1 {
            width: 500px; height: 500px; background: var(--accent-glow);
            top: -10%; left: -10%;
        }
        .blob-2 {
            width: 450px; height: 450px; background: rgba(234,164,220,0.25);
            bottom: -5%; right: -5%; animation-delay: -5s;
        }
        .blob-3 {
            width: 350px; height: 350px; background: rgba(242,130,145,0.15);
            top: 40%; left: 35%; animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(100px, 80px) scale(1.15) rotate(180deg); }
            100% { transform: translate(-50px, -60px) scale(0.9) rotate(360deg); }
        }

        /* --- STAGE MAIN SHELL --- */
        .stage-wrapper {
            position: relative;
            width: 100vw; height: 100vh;
            z-index: 10;
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        /* --- Top Status Bar --- */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            z-index: 30;
        }

        .bar-left, .bar-right {
            display: flex; align-items: center; gap: 8px;
            background: rgba(15,6,13,0.25);
            border: 1px solid var(--border-glass);
            padding: 6px 16px; border-radius: var(--radius-pill);
            backdrop-filter: blur(10px);
        }

        .bar-right { gap: 14px; }

        .bar-btn {
            background: transparent; border: none; color: var(--text-muted);
            display: flex; align-items: center; gap: 6px; cursor: pointer;
            font-size: 13px; font-weight: 600; transition: color 0.2s ease;
        }
        .bar-btn:hover { color: var(--text-main); }
        .bar-btn svg { width: 16px; height: 16px; }

        /* Session Switcher Badge Selector */
        .session-switcher {
            background: transparent; border: none; color: var(--text-main);
            font-size: 12px; font-weight: 700; outline: none; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .session-switcher option { background: #1d131b; color: var(--text-main); }

        /* --- Center Screen Arena --- */
        .stage-center {
            flex: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 40px;
        }

        /* Ambient System clock */
        .system-clock-panel {
            text-align: center;
            display: flex; flex-direction: column; gap: 4px;
            text-shadow: 0 4px 15px rgba(15,6,13,0.4);
            animation: fade-down 0.8s var(--ease-leonux) forwards;
        }
        .clock-time { font-size: 72px; font-weight: 200; letter-spacing: -0.04em; }
        .clock-date { font-size: 16px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        @keyframes fade-down { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        /* Login Card Frame */
        .login-card {
            width: 100%; max-width: 420px;
            background: var(--surface-base);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-win);
            padding: 32px;
            position: relative;
            overflow: hidden;
            display: flex; flex-direction: column;
            gap: 24px;
            transition: transform 0.4s var(--ease-leonux), opacity 0.4s ease;
        }

        /* Class for shaking the terminal panel on failure */
        .login-card.shake {
            animation: shake-error 0.5s ease;
        }

        @keyframes shake-error {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        /* --- SCREEN 1: Dynamic User Selection View --- */
        .user-scroller-screen {
            display: flex; flex-direction: column; gap: 16px; width: 100%;
        }
        .user-scroller-screen.hidden { display: none; }

        .scroller-title {
            font-size: 12px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.8px; text-align: center;
        }

        .user-cards-list {
            display: flex; flex-direction: column; gap: 10px; max-height: 220px;
            overflow-y: auto; padding-right: 4px;
        }

        .user-entry-card {
            display: flex; align-items: center; gap: 16px; padding: 14px 20px;
            background: var(--surface-panel); border: 1px solid var(--border-glass);
            border-radius: var(--radius-l); cursor: pointer;
            transition: all 0.2s var(--ease-leonux);
        }
        .user-entry-card:hover {
            background: var(--surface-hover); border-color: var(--border-mid);
            transform: scale(1.02);
        }

        .user-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(223,118,202,0.15); border: 1px solid var(--border-glass);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 16px; color: var(--accent);
            text-transform: uppercase; position: relative; overflow: hidden;
        }
        .user-avatar::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(248,241,247,0.1) 0%, transparent 100%);
        }

        .user-meta { display: flex; flex-direction: column; gap: 2px; }
        .user-display-name { font-size: 14px; font-weight: 600; color: var(--text-main); }
        .user-username { font-size: 11px; color: var(--text-muted); font-family: monospace; }

        /* Add Custom User Button */
        .add-user-btn {
            background: transparent; border: 1px dashed var(--border-glass);
            color: var(--text-muted); display: flex; align-items: center; justify-content: center;
            gap: 10px; font-size: 13px; font-weight: 600; padding: 12px;
            border-radius: var(--radius-l); cursor: pointer; transition: 0.2s;
        }
        .add-user-btn:hover {
            color: var(--text-main); border-color: var(--border-mid); background: var(--surface-hover);
        }

        /* --- SCREEN 2: Secure Password Prompt --- */
        .password-prompt-screen {
            display: none; flex-direction: column; align-items: center; gap: 20px; width: 100%;
            animation: slide-in-pane 0.4s var(--ease-leonux) forwards;
        }
        .password-prompt-screen.active { display: flex; }

        @keyframes slide-in-pane {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .prompt-avatar {
            width: 64px; height: 64px; font-size: 24px;
        }

        .prompt-heading { text-align: center; }
        .prompt-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
        .prompt-subtitle { font-size: 11px; color: var(--text-muted); font-family: monospace; margin-top: 2px;}

        /* Password Form Control */
        .password-form { width: 100%; display: flex; flex-direction: column; gap: 14px; }
        
        .input-group {
            position: relative; display: flex; align-items: center; width: 100%;
        }

        .input-icon {
            position: absolute; left: 16px; width: 16px; height: 16px;
            color: var(--text-muted); pointer-events: none;
        }

        .password-field {
            width: 100%;
            background: rgba(15,6,13,0.3);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 12px 48px;
            color: var(--text-main);
            font-family: inherit; font-size: 14px;
            outline: none; transition: all 0.2s ease;
        }
        .password-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(223,118,202,0.15);
        }

        .eye-toggle {
            position: absolute; right: 16px; cursor: pointer;
            width: 18px; height: 18px; color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
        }
        .eye-toggle:hover { color: var(--text-main); }

        /* CAPS LOCK Alert indicator */
        .caps-lock-warning {
            display: none; align-items: center; gap: 8px; font-size: 11px; font-weight: 700;
            color: var(--warning); background: rgba(237,193,128,0.08);
            border: 1px solid rgba(237,193,128,0.15); padding: 8px 12px; border-radius: 6px;
            animation: pulse-warn 1s ease infinite alternate;
        }
        .caps-lock-warning.active { display: flex; }
        @keyframes pulse-warn { from { border-color: rgba(237,193,128,0.15); } to { border-color: var(--warning); } }

        /* Action Buttons */
        .action-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; }
        
        .btn {
            flex: 1; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s var(--ease-leonux); border: 1px solid transparent;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-secondary {
            background: rgba(248,241,247,0.03); border-color: var(--border-glass); color: var(--text-main);
        }
        .btn-secondary:hover { background: var(--surface-hover); border-color: var(--border-mid); }
        
        .btn-primary {
            background: var(--accent); color: var(--bg-body); font-weight: 700;
            box-shadow: 0 8px 24px var(--accent-glow);
        }
        .btn-primary:hover:not(:disabled) {
            background: #e387d1; box-shadow: 0 12px 32px var(--accent-glow); transform: translateY(-1px);
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* --- SCREEN 3: Add Custom User view --- */
        .add-user-screen {
            display: none; flex-direction: column; gap: 16px; width: 100%;
            animation: slide-in-pane 0.4s var(--ease-leonux) forwards;
        }
        .add-user-screen.active { display: flex; }

        .add-user-title { font-size: 16px; font-weight: 700; color: var(--text-main); text-align: center; }

        /* --- Lower Navigation Disclaimer Info --- */
        .stage-footer {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: var(--text-muted); font-weight: 500;
            letter-spacing: 0.5px; z-index: 30;
        }

        .terminal-cli-hint {
            background: rgba(248,241,247,0.03); border: 1px solid var(--border-glass);
            border-radius: 4px; padding: 4px 8px; cursor: pointer; transition: 0.2s;
            font-family: monospace; display: flex; align-items: center; gap: 6px;
        }
        .terminal-cli-hint:hover { background: var(--surface-hover); color: var(--accent); }

        /* --- FULLSYSTEM TTY COMMAND LINE TERMINAL FALLBACK --- */
        .tty-overlay {
            position: fixed; inset: 0; background: #0f060d; z-index: 100;
            display: none; flex-direction: column; padding: 32px;
            font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px;
            line-height: 1.6; color: var(--success); overflow-y: auto;
        }
        .tty-overlay.active { display: flex; }

        .tty-line { white-space: pre-wrap; word-break: break-all; margin-bottom: 6px; }
        .tty-prompt-row { display: flex; align-items: center; gap: 8px; }
        .tty-input {
            background: transparent; border: none; outline: none;
            color: inherit; font-family: inherit; font-size: inherit; flex: 1;
        }

        /* --- DYNAMIC SYSTEMD PARALLEL BOOT LOADER DE SPLASH --- */
        .systemd-boot-splash {
            position: fixed; inset: 0; background: #020102; z-index: 200;
            display: none; flex-direction: column; padding: 40px;
            font-family: monospace; font-size: 13px; color: #eaa4dc;
            overflow-y: auto;
        }
        .systemd-boot-splash.active { display: flex; }

        .boot-row { display: flex; gap: 12px; margin-bottom: 4px; }
        .boot-ok { color: var(--success); font-weight: 700; min-width: 60px; }
        .boot-desc { color: #eaa4dc; }

        /* Desktop Simulation Welcome Target */
        .welcome-de-screen {
            position: fixed; inset: 0; background: #0a0208; z-index: 300;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            gap: 24px; animation: scale-up-fade 1.2s var(--ease-leonux) forwards;
            background-size: cover;
        }
        .welcome-de-screen.active { display: flex; }
        .welcome-glow {
            width: 140px; height: 140px; border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 50px var(--accent-glow); animation: welcome-pulse 2s infinite ease-in-out;
        }
        @keyframes welcome-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* --- GLOBAL SYSTEM CONFIRMATION DIALOG MODAL --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15,6,13,0.5);
            backdrop-filter: blur(10px); z-index: 500;
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-card {
            width: 90%; max-width: 400px;
            background: rgba(28,18,26,0.95); border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl); box-shadow: 0 24px 60px rgba(15,6,13,0.8);
            padding: 24px; display: flex; flex-direction: column; gap: 20px;
            transform: scale(0.95); transition: transform 0.3s var(--ease-leonux);
        }
        .modal-overlay.active .modal-card { transform: scale(1); }

        .modal-title-row { display: flex; align-items: center; gap: 12px; }
        .modal-title { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .modal-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; }
    </style>
<style id="malva-overrides">body{background:#1d101c url(../../brand/wallpapers/malva-dusk-2560x1440.jpg) center/cover no-repeat fixed !important;animation:none !important}[data-theme="light"] body{background:#f6f0f6 url(../../brand/wallpapers/malva-dawn-2560x1440.jpg) center/cover no-repeat fixed !important}.blob{display:none !important}</style></head>
<body>

    <div class="noise-layer"></div>
    <div class="ambient-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- MAIN DISPLAY MANAGER LAYER -->
    <div class="stage-wrapper" id="gdm-stage">
        
        <!-- STATUS BAR (TOP ROW) -->
        <header class="status-bar">
            <div class="bar-left">
                <!-- Dropdown session selector (GDM style) -->
                <button class="bar-btn">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                    <select class="session-switcher" id="session-select">
                        <option value="desktop" selected>Leonux Glass Desktop</option>
                        <option value="shell">Leonux Core Shell</option>
                        <option value="retro">Retro CRT Environment</option>
                    </select>
                </button>
            </div>

            <div class="bar-right">
                <!-- WiFi Status symbol -->
                <button class="bar-btn" id="btn-wifi" title="Toggle Wi-Fi Link">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 19h.01M8.5 15.5a5 5 0 017 0m-9.5-3.5a9 9 0 0112 0m-14.5-3.5a13 13 0 0117 0"/></svg>
                    <span id="wifi-status-lbl">Online</span>
                </button>
                
                <!-- Accessibility Widget -->
                <button class="bar-btn" id="btn-accessibility" title="Toggle Accessibility Options">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
                </button>

                <!-- System Power Operations Trigger -->
                <button class="bar-btn" id="btn-power" title="System Power Operations">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 11-12.73 0M12 2v10"/></svg>
                </button>
            </div>
        </header>

        <!-- CENTER DISPLAY VIEWPORTS -->
        <div class="stage-center">
            
            <div class="system-clock-panel">
                <div class="clock-time" id="
